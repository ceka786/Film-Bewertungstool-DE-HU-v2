<!doctype html>
<!--
  NETFLIX-KATALÓGUS DE/HU – a weboldal
  ====================================
  Egyetlen fájl: HTML (szerkezet) + CSS (kinézet) + JavaScript (működés).
  Adatot nem gyűjt, csak beolvassa a data/movies.json fájlt, amit az
  update.py készít. A pipák és a szűrők a böngésződben tárolódnak.
  Bővebb magyarázat: DOKUMENTACIO.md
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streaming-Katalog DE & HU</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎞️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* ===== 1. SZÍNEK ÉS BETŰTÍPUS ============================================
   A :root a "gyökér", ide tesszük a változókat (--bg = háttér, --ink = szöveg).
   Így egy helyen átszínezhető az egész oldal. A sötét mód automatikusan
   átvált a telefon beállítása szerint (prefers-color-scheme). */
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#18212B; --muted:#5E6B78;
  --line:#CFD6DE; --lamp:#F2B632; --lamp-ink:#3A2A00; --off:#9AA5B1;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#1A222B; --ink:#E8EDF2; --muted:#93A1AF;
    --line:#2C3743; --lamp:#F2B632; --lamp-ink:#231900; --off:#56626E;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#1A222B; --ink:#E8EDF2; --muted:#93A1AF;
  --line:#2C3743; --lamp:#F2B632; --lamp-ink:#231900; --off:#56626E;
}
/* ===== 2. ALAPOK ======================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
img{max-width:100%}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;line-height:.95;letter-spacing:-.02em;margin:0}
h1 small{display:block;font-size:.38em;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:.5em}
/* ===== 3. FEJLÉC ÉS SZŰRŐSÁV =========================================== */
.controls{background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
.controls-inner{max-width:760px;margin:0 auto;display:grid;gap:8px}
input[type=search],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;font-size:15px;border:0;border-radius:7px;padding:8px 0;background:none;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.lang{display:flex;gap:4px;justify-content:flex-end;margin-bottom:10px}
.lang button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{max-width:760px;margin:0 auto;padding:10px 16px 0;color:var(--muted);font-size:14px}
main{max-width:760px;margin:0 auto;padding:6px 8px 40px}
/* ===== 4. EGY FILM SORA (poszter | cím | pontszámok) ==================== */
.film{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.poster{width:54px;height:81px;border-radius:5px;background:var(--line);object-fit:cover;display:block}
.title{font-weight:600;font-size:17px;line-height:1.2}
.meta{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.flags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.flag{font-size:13px;border-radius:6px;padding:2px 7px;border:1px solid var(--line);background:var(--surface)}
.flag.off{color:#C0392B;text-decoration:line-through;background:none;border-color:#C0392B}
/* szolgáltató-logók a zászló mellett; a már nem elérhető logó szürke és halvány */
.flag img{width:18px;height:18px;border-radius:4px;vertical-align:-4px;margin-left:4px}
.flag img.off{filter:grayscale(1);opacity:.35}
.flag .svct{font-size:11px;font-weight:600;margin-left:4px}
.flag .svct.off{opacity:.4}
/* szolgáltató-kapcsolók a szűrősávban */
.svcbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.svc{font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 2px;cursor:pointer}
.svc img{width:28px;height:28px;border-radius:6px;filter:grayscale(1);opacity:.45}
.svc[aria-pressed=true]{border:2px solid var(--ink);color:var(--ink);font-weight:600;padding:6px 1px}
.svc[aria-pressed=true] img{filter:none;opacity:1}
.flag.off::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#C0392B;margin-right:5px;vertical-align:middle;text-decoration:none}
.scores{display:grid;gap:4px;justify-items:end;text-align:right}
.imdb{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.imdb.hi{background:var(--lamp);color:var(--lamp-ink);border-radius:6px;padding:2px 6px}
.sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.seen{font:inherit;font-size:13px;border-radius:6px;padding:2px 8px;border:1px dashed var(--muted);background:none;color:var(--muted);cursor:pointer}
.seen[aria-pressed=true]{border:1px solid #2E9E5B;background:#2E9E5B;color:#fff}
.pw{position:relative;display:block;width:54px}
.tick{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#2E9E5B;color:#fff;font-size:12px;line-height:20px;text-align:center;border:2px solid var(--bg)}
.film.watched .title{color:var(--muted)}
.film a{color:inherit;text-decoration:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.tools button,.tools label{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
/* Elrejtés-gomb (✕): kicsi kör a pontszám-oszlop tetején */
.hide{font:inherit;font-size:13px;line-height:1;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;padding:0}
.hide:hover{border-color:#C0392B;color:#C0392B}
.star{font:inherit;font-size:13px;border-radius:6px;padding:2px 8px;border:1px dashed var(--muted);background:none;color:var(--muted);cursor:pointer}
.star[aria-pressed=true]{border:1px solid #C98A00;background:#C98A00;color:#fff}
.rec{font:inherit;font-size:13px;border-radius:6px;padding:2px 8px;border:1px dashed var(--muted);background:none;color:var(--muted);cursor:pointer}
.rec[aria-pressed=true]{border:1px solid #6C4FB8;background:#6C4FB8;color:#fff}
.recbadge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;background:#6C4FB8;color:#fff}
#resetAll{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
.new{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--lamp);color:var(--lamp-ink)}
/* ===== 5. "NYELV ÉS ORSZÁG" PANEL (a pipa/x gombok) ===================== */
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.panel summary{font-size:15px;cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:" ▾";color:var(--muted)}
details.panel[open] summary::after{content:" ▴"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer}
.chip[data-s="1"]{border-color:#2E9E5B;background:#2E9E5B;color:#fff}
.chip[data-s="2"]{border-color:#C0392B;background:#C0392B;color:#fff}
.plabel{font-size:13px;color:var(--muted);margin-top:8px}
.gtag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:none}
.combo{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.film.gone{opacity:.42;filter:grayscale(1)}
.film.gone .imdb.hi{background:none;color:inherit;padding:0}
.empty,.error{padding:40px 16px;text-align:center;color:var(--muted)}
#more{height:1px}
footer{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}
footer a{color:inherit}
@media (min-width:600px){.controls-inner{grid-template-columns:1fr 1fr}.controls-inner>.full{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <div class="lang" role="group" aria-label="Sprache / Nyelv">
    <button data-l="de">DE</button><button data-l="hu">HU</button>
  </div>
  <h1><span data-i="h1"></span><small data-i="sub"></small></h1>
</header>

<div class="controls">
  <div class="controls-inner">
    <input class="full" type="search" id="q" data-i-ph="search">
    <div class="seg full" role="group" aria-label="Land">
      <button data-c="ALL" aria-pressed="true" data-i="all"></button>
      <button data-c="DE" aria-pressed="false">🇩🇪 DE</button>
      <button data-c="HU" aria-pressed="false">🇭🇺 HU</button>
      <button data-c="BOTH" aria-pressed="false" data-i="both"></button>
    </div>
    <div class="svcbar full" id="svcBar" role="group" aria-label="Streaming"></div>
    <div class="row2">
      <select id="sort" aria-label="Sortierung">
        <option value="combo" data-i="s_combo"></option>
        <option value="imdb">IMDb</option>
        <option value="rt">Rotten Tomatoes</option>
        <option value="mc">Metacritic</option>
        <option value="year" data-i="s_year"></option>
        <option value="added" data-i="s_added"></option>
        <option value="gone" data-i="s_gone"></option>
        <option value="title" data-i="s_title"></option>
      </select>
      <select id="votes" aria-label="Mindestanzahl IMDb-Stimmen">
        <option value="0" data-i="v0"></option>
        <option value="1000"></option>
        <option value="10000"></option>
        <option value="100000"></option>
      </select>
    </div>
    <div class="row2">
      <select id="yFrom" aria-label="Jahr von"></select>
      <select id="yTo" aria-label="Jahr bis"></select>
    </div>
    <div class="row2">
      <select id="genre" aria-label="Genre"></select>
      <select id="runtime" aria-label="Laufzeit">
        <option value="" data-i="rt_any"></option>
        <option value="0-90" data-i="rt_90"></option>
        <option value="0-120" data-i="rt_120"></option>
        <option value="120-999" data-i="rt_long"></option>
      </select>
    </div>
    <details class="panel full">
      <summary data-i="panelTitle"></summary>
      <div class="plabel" data-i="panelHint"></div>
      <div class="plabel" data-i="langLabel"></div>
      <div class="chips" id="langChips"></div>
      <div class="plabel" data-i="countryLabel"></div>
      <div class="chips" id="countryChips"></div>
      <button class="chip" id="resetPicks" data-i="resetPicks" style="margin-top:8px"></button>
    </details>
    <select id="seenFilter" class="full" aria-label="Gesehen">
      <option value="all" data-i="sf_all"></option>
      <option value="no" data-i="sf_no"></option>
      <option value="yes" data-i="sf_yes"></option>
    </select>
    <select id="listFilter" class="full" aria-label="Liste">
      <option value="all" data-i="l_all"></option>
      <option value="watch" data-i="l_watch"></option>
      <option value="rec" data-i="l_rec"></option>
      <option value="hidden" data-i="l_hidden"></option>
    </select>
    <label class="toggle full"><input type="checkbox" id="onlyNew"> <span data-i="onlyNew"></span></label>
    <label class="toggle full"><input type="checkbox" id="showGone" checked> <span data-i="showGone"></span></label>
  </div>
</div>

<div class="stats"><button id="resetAll"></button></div>
<p class="stats" id="stats"></p>
<main id="list"></main>
<div id="more"></div>

<footer>
  <div class="tools">
    <button id="exp" data-i="exp"></button>
    <button id="expRec" data-i="expRec"></button>
    <label><span data-i="imp"></span><input type="file" id="imp" accept="application/json,.json" hidden></label>
  </div>
  <p data-i="seenNote"></p>
  <span data-i="f1"></span> <a href="https://www.themoviedb.org" rel="noopener">TMDB</a> <span data-i="f2"></span> <a href="https://www.omdbapi.com" rel="noopener">OMDb</a>. <span data-i="f3"></span>
</footer>

<script>
/* ===== 1. SEGÉDESZKÖZÖK ==================================================
   $   = rövidítés elemek megkeresésére ("query selector")
   IMG = a poszterképek címének eleje (a film saját útvonala jön utána) */
const $ = s => document.querySelector(s);
/* ===== 2. SZÖVEGEK KÉT NYELVEN ===========================================
   Minden felirat itt van németül (de) és magyarul (hu). A HTML-ben csak
   jelölés van (data-i="..."), a setLang() tölti be a megfelelő szöveget. */
const T = {
  de: { h1:"Was läuft im Streaming?", sub:"Filme auf Netflix, Prime Video, Disney+ und HBO Max – in Deutschland und Ungarn", svcLast:"Mindestens ein Dienst muss ausgewählt bleiben.",
    search:"Titel suchen", all:"Alle", both:"Beide", s_year:"Neueste Filme", s_added:"Neu im Katalog",
    s_gone:"Zuletzt entfernt", s_title:"Titel A–Z", v0:"Alle Stimmen", vN:n=>`ab ${n} Stimmen`,
    showGone:"Nicht mehr verfügbare Filme zeigen", seen:"Gesehen", panelTitle:"Sprache und Land", panelHint:"Tippe einmal für ✓ (nur diese), zweimal für ✗ (ausschließen), dreimal zurück auf neutral.",
    langLabel:"Originalsprache", countryLabel:"Produktionsland", resetPicks:"Auswahl zurücksetzen", picksActive:n=>` ${n} aktiv`, s_combo:"Kombi-Score", g_any:"Alle Genres", rt_any:"Laufzeit: alle", rt_90:"bis 90 Min.", rt_120:"bis 2 Std.", rt_long:"über 2 Std.", onlyNew:"Nur neu in den letzten 7 Tagen", newBadge:"NEU", min:"Min.", yFrom:"Jahr von", yTo:"bis Jahr", yAny:"alle", sf_all:"Gesehene und ungesehene", sf_no:"Nur ungesehene", sf_yes:"Nur gesehene", watch:"Merken", rec:"Ich empfehle", recBadge:"🍽 Empfehlung", l_all:"Alle Filme", l_watch:"Nur meine Merkliste", l_rec:"Nur meine Empfehlungen", l_hidden:"Ausgeblendete Filme", hideT:"Ausblenden", unhideT:"Wieder einblenden",
    resetAll:n=>n ? `Filter zurücksetzen (${n} aktiv)` : "Keine Filter aktiv",
    expRec:"Empfehlungen als Datei", recHint:"Datei ajanlasok.json ins Repo laden, dann sehen sie auch deine Brüder.",
    exp:"Meine Listen sichern", imp:"Meine Listen laden", impOk:n=>`${n} Einträge übernommen.`, impErr:"Datei konnte nicht gelesen werden.", seenNote:"Deine Häkchen werden nur auf diesem Gerät gespeichert. Sichere die Liste ab und zu, bevor du Browserdaten löschst.", loading:"Katalog wird geladen …",
    stats:(n,a)=>`${n} Filme, davon ${a} aktuell verfügbar.`, stand:d=>` Stand: ${d}.`,
    empty:"Keine Filme gefunden. Suche oder Filter anpassen.",
    error:"Noch keine Daten vorhanden. Starte in GitHub unter „Actions“ den Workflow „Katalog aktualisieren“ und lade die Seite danach neu.",
    since:d=>`Seit ${d}`, until:d=>`bis ${d}`, removed:d=>`Entfernt am ${d}`,
    f1:"Daten:", f2:"(Verfügbarkeit via JustWatch) und", f3:"Dieses Projekt wird nicht von TMDB unterstützt oder zertifiziert.",
    locale:"de-DE" },
  hu: { h1:"Mi megy a streamingen?", sub:"Filmek a Netflixen, Prime Videón, Disney+-on és HBO Maxon – Németországban és Magyarországon", svcLast:"Legalább egy szolgáltatónak kiválasztva kell maradnia.",
    search:"Keresés cím alapján", all:"Mind", both:"Mindkettő", s_year:"Legújabb filmek", s_added:"Új a katalógusban",
    s_gone:"Nemrég eltávolítva", s_title:"Cím A–Z", v0:"Szavazat: mind", vN:n=>`min. ${n} szavazat`,
    showGone:"Már nem elérhető filmek mutatása", seen:"Láttam", panelTitle:"Nyelv és ország", panelHint:"Egy koppintás: ✓ (csak ezek), kettő: ✗ (kizárás), három: semleges.",
    langLabel:"Eredeti nyelv", countryLabel:"Gyártó ország", resetPicks:"Választás törlése", picksActive:n=>` ${n} aktív`, s_combo:"Kombi pontszám", g_any:"Minden műfaj", rt_any:"Hossz: mind", rt_90:"max. 90 perc", rt_120:"max. 2 óra", rt_long:"2 óránál hosszabb", onlyNew:"Csak az elmúlt 7 nap újdonságai", newBadge:"ÚJ", min:"perc", yFrom:"Évtől", yTo:"Évig", yAny:"mind", sf_all:"Látott és nem látott", sf_no:"Csak nem látott", sf_yes:"Csak látott", watch:"Megnézem", rec:"Ajánlom", recBadge:"🍽 Ajánlott", l_all:"Minden film", l_watch:"Csak a listám", l_rec:"Csak az ajánlásaim", l_hidden:"Elrejtett filmek", hideT:"Elrejtés", unhideT:"Visszahozás",
    resetAll:n=>n ? `Szűrők törlése (${n} aktív)` : "Nincs aktív szűrő",
    expRec:"Ajánlások fájlba", recHint:"Az ajanlasok.json fájlt töltsd fel a repóba, akkor a tesóid is látják.",
    exp:"Listáim mentése", imp:"Listáim betöltése", impOk:n=>`${n} bejegyzés betöltve.`, impErr:"A fájlt nem sikerült beolvasni.", seenNote:"A pipák csak ezen az eszközön tárolódnak. Időnként mentsd el a listát, mielőtt böngészőadatokat törölsz.", loading:"Katalógus betöltése …",
    stats:(n,a)=>`${n} film, ebből ${a} jelenleg elérhető.`, stand:d=>` Frissítve: ${d}.`,
    empty:"Nincs találat. Módosítsd a keresést vagy a szűrőket.",
    error:"Még nincsenek adatok. GitHubon az „Actions” fülön indítsd el a „Katalog aktualisieren” workflow-t, majd töltsd újra az oldalt.",
    since:d=>`Elérhető: ${d} óta`, until:d=>`${d}-ig`, removed:d=>`Eltávolítva: ${d}`,
    f1:"Adatok:", f2:"(elérhetőség: JustWatch) és", f3:"Ezt a projektet a TMDB nem támogatja és nem hitelesítette.",
    locale:"hu-HU" }
};
let lang = (()=>{ try { return localStorage.getItem("lang") } catch(e){ return null } })()
  || ((navigator.language||"").toLowerCase().startsWith("hu") ? "hu" : "de");
const t = k => T[lang][k];
function setLang(l){
  lang = l;
  try { localStorage.setItem("lang", l) } catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("[data-i-ph]").forEach(el => { el.placeholder = t(el.dataset.iPh); el.setAttribute("aria-label", t(el.dataset.iPh)); });
  document.querySelectorAll("#votes option").forEach(o => { if (+o.value) o.textContent = t("vN")(nf().format(+o.value)); });
  $("#list").addEventListener("click", e => {
  // ⭐ Merkliste und 🍽 Empfehlung: umschalten und Zeile neu zeichnen
  const hb = e.target.closest(".hide");
  if (hb) {
    const row = hb.closest(".film"), id = row.dataset.id;
    if (hidden[id]) delete hidden[id]; else hidden[id] = new Date().toISOString().slice(0,10);
    store("hidden", hidden);
    // a film kikerül az aktuális nézetből (elrejtve vagy visszahozva)
    view = view.filter(m => String(m.id) !== id); shown = Math.max(0, shown - 1);
    row.remove(); updateStats();
    if (!view.length) $("#list").innerHTML = `<p class="empty">${t("empty")}</p>`;
    return;
  }
  const sb = e.target.closest(".star"), rb = e.target.closest(".rec");
  if (sb || rb) {
    const row = (sb || rb).closest(".film"), id = row.dataset.id;
    const obj = sb ? watch : recs, key = sb ? "watch" : "recs";
    if (obj[id]) delete obj[id]; else obj[id] = new Date().toISOString().slice(0,10);
    store(key, obj);
    const m = all.find(x => String(x.id) === id);
    if (m) { m._on = isAvailable(m); row.outerHTML = card(m); }
    return;
  }
  const b = e.target.closest(".seen"); if (!b) return;
  const row = b.closest(".film"), id = row.dataset.id;
  if (seen[id]) delete seen[id]; else seen[id] = new Date().toISOString().slice(0,10);
  saveSeen();
  const w = !!seen[id];
  row.classList.toggle("watched", w);
  b.setAttribute("aria-pressed", w);
  b.textContent = (w ? "✓ " : "") + t("seen");
});
/* ===== 7. KATTINTÁSOK ==================================================== */
document.addEventListener("click", e => {
  const c = e.target.closest(".chip[data-kind]"); if (!c) return;
  const {kind, code} = c.dataset;
  picks[kind][code] = ((picks[kind][code] || 0) + 1) % 3;
  if (!picks[kind][code]) delete picks[kind][code];
  savePicks(); fillChips(); apply();
});
$("#resetAll").addEventListener("click", resetAll);
$("#svcBar").addEventListener("click", e => {
  const b = e.target.closest(".svc"); if (!b) return;
  const k = b.dataset.svc;
  // az utolsó bekapcsolt szolgáltatót nem lehet kikapcsolni (különben üres lenne a lista)
  if (svcSel(k) && svcKeys().filter(svcSel).length === 1) { alert(t("svcLast")); return; }
  svcOn[k] = !svcSel(k);
  store("svcOn", svcOn); fillSvcBar(); apply();
});
$("#expRec").addEventListener("click", () => {
  // Datei zum Hochladen ins Repo: data/ajanlasok.json
  const blob = new Blob([JSON.stringify({recs}, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "ajanlasok.json";
  document.body.appendChild(a); a.click(); a.remove();
  alert(t("recHint"));
});
$("#resetPicks").addEventListener("click", () => { picks.lang = {}; picks.country = {}; savePicks(); fillChips(); apply(); });
$("#exp").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({seen, watch, recs, hidden}, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `gesehen-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
});
$("#imp").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const add = d.seen || {};
    Object.assign(seen, add); saveSeen();
    Object.assign(watch, d.watch || {}); store("watch", watch);
    Object.assign(recs, d.recs || {}); store("recs", recs);
    Object.assign(hidden, d.hidden || {}); store("hidden", hidden);
    apply();
    const n = Object.keys(add).length + Object.keys(d.watch || {}).length + Object.keys(d.recs || {}).length + Object.keys(d.hidden || {}).length;
    alert(t("impOk")(n));
  } catch(err) { alert(t("impErr")); }
  e.target.value = "";
});
document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  document.title = t("h1");
  fillYears();
  fillGenres();
  if (loaded) { fillChips(); apply(); }
}
/* ===== 3. ÁLLAPOT ========================================================
   all     = az összes film        | view    = ami épp a szűrők után látszik
   seen    = a "láttam" pipáid     | picks   = nyelv/ország választás
   Ezek localStorage-ba mentődnek: ez a böngésző saját kis tárolója. */
let loaded = false;
let years = [], genreNames = {}, initial = "", weekAgo = "";
function fillGenres(){
  const sel = $("#genre"), cur = sel.value;
  const list = Object.entries(genreNames).map(([id,n]) => [id, n[lang] || n.de || id])
    .sort((a,b) => a[1].localeCompare(b[1], lang));
  sel.innerHTML = `<option value="">${t("g_any")}</option>` + list.map(([id,n]) => `<option value="${id}">${esc(n)}</option>`).join("");
  sel.value = cur;
}
function combo(m){
  const r = m.r; if (!r) return null;
  const v = [];
  if (r.imdb != null) v.push(r.imdb * 10);
  if (r.rt != null) v.push(r.rt);
  if (r.mc != null) v.push(r.mc);
  return v.length ? Math.round(v.reduce((a,b)=>a+b,0) / v.length) : null;
}
/* "ÚJ" jelölés: egy kiválasztott szolgáltatónál az elmúlt 7 napban jelent meg.
   A "since" a szolgáltató első figyelési napja – az aznapi első betöltés nem számít újnak. */
function isNew(m){
  const cs = (country === "DE" || country === "HU") ? [country] : Object.keys(m.avail);
  return cs.some(c => Object.entries(m.avail[c] || {}).some(([k, a]) =>
    svcSel(k) && a.on && a.first && a.first >= weekAgo && a.first > (since[`${c}:${k}`] || initial)));
}
const gname = id => { const n = genreNames[id]; return n ? (n[lang] || n.de) : null; };
const gtags = m => (m.genres || []).map(gname).filter(Boolean).slice(0,2)
  .map(n => `<span class="gtag">${esc(n)}</span>`).join("");
let picks = (()=>{ try { return JSON.parse(localStorage.getItem("picks") || "{}") } catch(e){ return {} } })();
picks.lang = picks.lang || {}; picks.country = picks.country || {};
const savePicks = () => { try { localStorage.setItem("picks", JSON.stringify(picks)) } catch(e){} };
const dn = (type, code) => {
  try { return new Intl.DisplayNames([t("locale")], {type}).of(code) || code } catch(e){ return code }
};
function chipList(kind){
  const key = kind === "lang" ? "lang" : "country";
  const count = {};
  all.forEach(m => { const v = m[key]; if (v) count[v] = (count[v] || 0) + 1; });
  return Object.keys(count).sort((a,b) => count[b] - count[a] || a.localeCompare(b));
}
function fillChips(){
  for (const [kind, id] of [["lang","#langChips"],["country","#countryChips"]]) {
    const box = $(id); if (!box) continue;
    box.innerHTML = chipList(kind).map(code => {
      const st = picks[kind][code] || 0;
      const mark = st === 1 ? "✓ " : st === 2 ? "✗ " : "";
      const name = kind === "lang" ? dn("language", code) : dn("region", code);
      return `<button class="chip" data-kind="${kind}" data-code="${code}" data-s="${st}">${mark}${esc(name)}</button>`;
    }).join("");
  }
  const n = Object.values(picks.lang).filter(Boolean).length + Object.values(picks.country).filter(Boolean).length;
  const sum = document.querySelector("details.panel summary");
  if (sum) sum.textContent = t("panelTitle") + (n ? t("picksActive")(n) : "");
}
function passPicks(m){
  for (const [kind, key] of [["lang","lang"],["country","country"]]) {
    const p = picks[kind], v = m[key];
    const wanted = Object.entries(p).filter(([,s]) => s === 1).map(([c]) => c);
    if (v && p[v] === 2) return false;
    if (wanted.length && !(v && p[v] === 1)) return false;
  }
  return true;
}
function fillYears(){
  for (const [id, key] of [["#yFrom","yFrom"],["#yTo","yTo"]]) {
    const sel = $(id), cur = sel.value;
    const list = key === "yTo" ? [...years].reverse() : years;
    sel.innerHTML = `<option value="">${t(key)}: ${t("yAny")}</option>` +
      list.map(y => `<option value="${y}">${key === "yFrom" ? t("yFrom") : t("yTo")}: ${y}</option>`).join("");
    sel.value = cur;
    sel.setAttribute("aria-label", t(key));
  }
}
let seen = (()=>{ try { return JSON.parse(localStorage.getItem("seen") || "{}") } catch(e){ return {} } })();
function saveSeen(){ try { localStorage.setItem("seen", JSON.stringify(seen)) } catch(e){} }
// Merkliste (⭐) und eigene Empfehlungen (🍽) – genau wie "gesehen" lokal gespeichert
const load = (k) => { try { return JSON.parse(localStorage.getItem(k) || "{}") } catch(e){ return {} } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };
let watch = load("watch"), recs = load("recs");
let hidden = load("hidden");
/* Szolgáltatók: services = név + logó (a movies.json-ból), svcOn = melyik van bekapcsolva.
   Ha egy kulcs hiányzik az svcOn-ból, az bekapcsoltnak számít. */
const SVC_ORDER = ["netflix", "prime", "disney", "hbo"];
const LOGO = "https://image.tmdb.org/t/p/w92";
let services = {}, since = {}, svcOn = load("svcOn");
const svcSel = k => svcOn[k] !== false;
const svcKeys = () => SVC_ORDER.filter(k => services[k]).concat(Object.keys(services).filter(k => !SVC_ORDER.includes(k)));
function fillSvcBar(){
  $("#svcBar").innerHTML = svcKeys().map(k => {
    const sv = services[k];
    return `<button class="svc" data-svc="${k}" aria-pressed="${svcSel(k)}">${sv.logo ? `<img alt="" src="${LOGO}${sv.logo}">` : ""}${esc(sv.name || k)}</button>`;
  }).join("");
}   // elrejtett filmek: sehol nem jelennek meg, csak az "Elrejtett filmek" listában
let recsRemote = {};   // aus data/ajanlasok.json – sichtbar für alle Besucher

// Alle Filtereinstellungen merken (Auswahlfelder und Schalter)
const CTRL = ["#sort","#votes","#seenFilter","#listFilter","#yFrom","#yTo","#genre","#runtime"];
const SWITCH = ["#onlyNew","#showGone"];
function saveFilters(){
  const f = {country};
  CTRL.forEach(id => f[id] = $(id).value);
  SWITCH.forEach(id => f[id] = $(id).checked);
  store("filters", f);
}
function restoreFilters(){
  const f = load("filters");
  if (f.country) { country = f.country; document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === country)); }
  CTRL.forEach(id => { if (f[id] != null) $(id).value = f[id]; });
  SWITCH.forEach(id => { if (f[id] != null) $(id).checked = f[id]; });
}
// Zählt, wie viele Filter vom Normalzustand abweichen
function activeFilters(){
  let n = 0;
  if (country !== "ALL") n++;
  if (svcKeys().some(k => !svcSel(k))) n++;
  if ($("#q").value.trim()) n++;
  CTRL.forEach(id => { const v = $(id).value; if (id !== "#sort" && v && v !== "all" && v !== "0") n++; });
  if ($("#onlyNew").checked) n++;
  if (!$("#showGone").checked) n++;
  n += Object.values(picks.lang).filter(Boolean).length + Object.values(picks.country).filter(Boolean).length;
  return n;
}
function resetAll(){
  country = "ALL";
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === "ALL"));
  $("#q").value = "";
  CTRL.forEach(id => { const el = $(id); el.value = (id === "#sort") ? "combo" : (el.querySelector('option[value="all"]') ? "all" : ""); });
  $("#onlyNew").checked = false; $("#showGone").checked = true;
  picks.lang = {}; picks.country = {}; savePicks(); fillChips();
  svcOn = {}; store("svcOn", svcOn); fillSvcBar();
  saveFilters(); apply();
}
const IMG = "https://image.tmdb.org/t/p/w154";
const nf = () => new Intl.NumberFormat(t("locale"));
const df = d => d ? new Date(d).toLocaleDateString(t("locale"),{day:"2-digit",month:"2-digit",year:"2-digit"}) : "";
const ttl = m => (lang === "hu" ? m.title_hu : m.title) || m.title || m.title_hu || m.orig || "";
let all = [], view = [], shown = 0, country = "ALL", updated = null;
const PAGE = 60;

/* avail szerkezete: { "DE": { "netflix": {first, on, last, gone}, "prime": {...} }, "HU": {...} }
   onIn   = egy kiválasztott szolgáltatónál MOST elérhető az adott országban
   everIn = egy kiválasztott szolgáltatónál valaha elérhető volt ott */
const onIn = (m, c) => Object.entries(m.avail[c] || {}).some(([k, a]) => svcSel(k) && a.on);
const everIn = (m, c) => Object.keys(m.avail[c] || {}).some(svcSel);

function isAvailable(m){
  if (country === "DE" || country === "HU") return onIn(m, country);
  if (country === "BOTH") return onIn(m,"DE") && onIn(m,"HU");
  return onIn(m,"DE") || onIn(m,"HU");
}
function inScope(m){
  if (country === "DE" || country === "HU") return everIn(m, country);
  if (country === "BOTH") return everIn(m,"DE") && everIn(m,"HU");
  return everIn(m,"DE") || everIn(m,"HU");
}
function lastGone(m){
  return Object.values(m.avail).flatMap(r => Object.values(r)).map(a => a.gone || "").sort().pop() || "";
}

function num(v){ return v == null ? -Infinity : v; }

/* ===== 4. A SZŰRÉS ÉS RENDEZÉS ===========================================
   Itt dől el, mely filmek látszanak és milyen sorrendben.
   filter = kidobja, ami nem felel meg | sort = sorrendbe rakja */
function apply(){
  const q = $("#q").value.trim().toLowerCase();
  const sort = $("#sort").value;
  const minVotes = +$("#votes").value;
  const showGone = $("#showGone").checked;

  view = all.filter(m => {
    if (!inScope(m)) return false;
    m._on = isAvailable(m);
    if (!showGone && !m._on) return false;
    const yf = $("#yFrom").value, yt = $("#yTo").value;
    if ((yf || yt) && !m.year) return false;
    if (yf && m.year < yf) return false;
    if (yt && m.year > yt) return false;
    if (!passPicks(m)) return false;
    const g = $("#genre").value;
    if (g && !(m.genres || []).includes(+g)) return false;
    const rtv = $("#runtime").value;
    if (rtv) { const [lo, hi] = rtv.split("-").map(Number); if (!m.runtime || m.runtime <= lo || m.runtime > hi) return false; }
    if ($("#onlyNew").checked && !isNew(m)) return false;
    const lf = $("#listFilter").value;
    if (lf === "hidden" ? !hidden[m.id] : hidden[m.id]) return false;   // elrejtés
    if (lf === "watch" && !watch[m.id]) return false;
    if (lf === "rec" && !(recs[m.id] || recsRemote[m.id])) return false;
    const sf = $("#seenFilter").value;
    if (sf === "yes" && !seen[m.id]) return false;
    if (sf === "no" && seen[m.id]) return false;
    if (minVotes && ((m.r && m.r.votes) || 0) < minVotes) return false;
    if (q && !(`${m.title||""} ${m.title_hu||""} ${m.orig||""}`.toLowerCase().includes(q))) return false;
    return true;
  });

  const r = (m,k) => m.r ? num(m.r[k]) : -Infinity;
  const cmp = {
    combo:(a,b) => num(combo(b))-num(combo(a)) || r(b,"votes")-r(a,"votes"),
    imdb: (a,b) => r(b,"imdb")-r(a,"imdb") || r(b,"votes")-r(a,"votes"),
    rt:   (a,b) => r(b,"rt")-r(a,"rt") || r(b,"imdb")-r(a,"imdb"),
    mc:   (a,b) => r(b,"mc")-r(a,"mc") || r(b,"imdb")-r(a,"imdb"),
    year: (a,b) => (b.year||"").localeCompare(a.year||""),
    added:(a,b) => (b.added||"").localeCompare(a.added||""),
    gone: (a,b) => lastGone(b).localeCompare(lastGone(a)),
    title:(a,b) => ttl(a).localeCompare(ttl(b), lang),
  }[sort];
  // verfügbare zuerst, außer bei "Zuletzt entfernt"
  view.sort((a,b) => (sort !== "gone" && (b._on - a._on)) || cmp(a,b));

  updateStats();
  $("#list").innerHTML = view.length ? "" : `<p class="empty">${t("empty")}</p>`;
  shown = 0;
  renderMore();
}

/* Számláló és "Szűrők törlése" felirat frissítése */
function updateStats(){
  $("#resetAll").textContent = t("resetAll")(activeFilters());
  const avail = view.filter(m => m._on).length;
  $("#stats").textContent = t("stats")(nf().format(view.length), nf().format(avail)) + (updated ? t("stand")(new Date(updated).toLocaleString(t("locale"),{dateStyle:"short",timeStyle:"short"})) : "");
}

function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* Ország-jelvény: zászló + a szolgáltatók logói. A már nem elérhető szolgáltató
   logója szürke. Ha az országban sehol sem fut, piros keret és "…-ig" dátum. */
function flag(m, c, label){
  const reg = m.avail[c];
  if (!reg) return "";
  const list = Object.entries(reg).sort((x, y) => SVC_ORDER.indexOf(x[0]) - SVC_ORDER.indexOf(y[0]));
  const logos = list.map(([k, a]) => {
    const sv = services[k] || {name: k};
    const tip = `${sv.name || k}: ${a.on ? t("since")(df(a.first)) : t("removed")(df(a.gone))}`;
    return sv.logo
      ? `<img class="${a.on ? "" : "off"}" alt="${esc(sv.name || k)}" title="${esc(tip)}" src="${LOGO}${sv.logo}">`
      : `<span class="svct${a.on ? "" : " off"}" title="${esc(tip)}">${esc(sv.name || k)}</span>`;
  }).join("");
  if (list.some(([, a]) => a.on)) return `<span class="flag">${label}${logos}</span>`;
  const gone = list.map(([, a]) => a.gone || "").sort().pop();
  return `<span class="flag off">${label}${logos} ${t("until")(df(gone))}</span>`;
}

/* ===== 5. EGY FILM KIRAJZOLÁSA ===========================================
   Szövegből épít HTML-t. Az esc() védi az oldalt a különleges karakterektől. */
function card(m){
  const r = m.r || {};
  const imdb = r.imdb != null ? r.imdb.toFixed(1) : "–";
  const hi = r.imdb >= 7.5 ? " hi" : "";
  const orig = m.orig && m.orig !== ttl(m) ? `, ${esc(m.orig)}` : "";
  const link = m.imdb_id ? `https://www.imdb.com/title/${m.imdb_id}/` : `https://www.themoviedb.org/movie/${m.id}`;
  const w = !!seen[m.id], wl = !!watch[m.id], rc = !!(recs[m.id] || recsRemote[m.id]);
  return `<div class="film${m._on ? "" : " gone"}${w ? " watched" : ""}" data-id="${m.id}">
    <a class="pw" href="${link}" target="_blank" rel="noopener">${m.poster ? `<img class="poster" loading="lazy" alt="" src="${IMG}${m.poster}">` : `<div class="poster"></div>`}${w ? `<span class="tick" aria-hidden="true">✓</span>` : ""}</a>
    <div>
      <a class="title" href="${link}" target="_blank" rel="noopener">${esc(ttl(m))}</a>
      <div class="meta">${esc(m.year || "")}${m.runtime ? `, ${m.runtime} ${t("min")}` : ""}${orig}</div>
      <div class="flags">${isNew(m) ? `<span class="new">${t("newBadge")}</span>` : ""}${rc ? `<span class="recbadge">${t("recBadge")}</span>` : ""}${flag(m,"DE","🇩🇪")}${flag(m,"HU","🇭🇺")}${gtags(m)}<button class="seen" aria-pressed="${w}">${w ? "✓ " : ""}${t("seen")}</button><button class="star" aria-pressed="${wl}">${wl ? "★ " : "☆ "}${t("watch")}</button><button class="rec" aria-pressed="${!!recs[m.id]}">${t("rec")}</button></div>
    </div>
    <div class="scores">
      <button class="hide" title="${hidden[m.id] ? t("unhideT") : t("hideT")}" aria-label="${hidden[m.id] ? t("unhideT") : t("hideT")}">${hidden[m.id] ? "↺" : "✕"}</button>
      <div class="imdb${hi}" title="IMDb">${imdb}</div>
      <div class="combo" title="${t("s_combo")}">Ø ${combo(m) ?? "–"}</div>
      <div class="sub">🍅 ${r.rt != null ? r.rt + "%" : "–"}</div>
      <div class="sub">MC ${r.mc != null ? r.mc : "–"}</div>
    </div>
  </div>`;
}

/* ===== 6. FOKOZATOS BETÖLTÉS =============================================
   Nem rajzolunk ki egyszerre 7000 filmet, csak 60-at. Ha az oldal aljára
   érsz (IntersectionObserver figyeli), jön a következő adag. */
function renderMore(){
  const chunk = view.slice(shown, shown + PAGE);
  $("#list").insertAdjacentHTML("beforeend", chunk.map(card).join(""));
  shown += chunk.length;
}

new IntersectionObserver(e => { if (e[0].isIntersecting && shown < view.length) renderMore(); },
  {rootMargin:"800px"}).observe($("#more"));

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  country = b.dataset.c; saveFilters();
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  apply(); window.scrollTo({top:0});
}));
let qTimer; $("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(apply, 150); });
["#sort","#votes","#showGone","#seenFilter","#listFilter","#yFrom","#yTo","#genre","#runtime","#onlyNew"].forEach(s => $(s).addEventListener("change", () => { saveFilters(); apply(); }));

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
setLang(lang);
$("#stats").textContent = t("loading");
/* ===== 8. ADATOK BETÖLTÉSE ===============================================
   Ez fut le utoljára: beolvassa a JSON-fájlt, majd elindítja a szűrést. */
fetch("data/movies.json", {cache:"no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(db => {
    all = Object.values(db.movies);
    // régi (csak Netflix) adatforma átalakítása, amíg az új update.py le nem fut
    all.forEach(m => { for (const [c, a] of Object.entries(m.avail || {})) if ("on" in a || "first" in a) m.avail[c] = {netflix: a}; });
    services = db.services || {netflix: {name: "Netflix", logo: null}};
    since = db.since || {};
    fillSvcBar();
    updated = db.updated || null;
    genreNames = db.genres || {};
    initial = all.map(m => m.added || "").filter(Boolean).sort()[0] || "";
    weekAgo = new Date(Date.now() - 7*864e5).toISOString().slice(0,10);
    years = [...new Set(all.map(m => m.year).filter(Boolean))].sort();
    fillYears();
    fillGenres();
    fillChips();
    restoreFilters();      // gespeicherte Filter wieder einsetzen
    loaded = true;
    // Empfehlungen aus dem Repo (optional – Datei muss nicht existieren)
    fetch("data/ajanlasok.json", {cache:"no-cache"})
      .then(r => r.ok ? r.json() : null)
      .then(d => { if (d && d.recs) { recsRemote = d.recs; apply(); } })
      .catch(() => {});
    apply();
  })
  .catch(() => {
    $("#stats").textContent = "";
    $("#list").innerHTML = `<p class="error">${t("error")}</p>`;
  });
</script>
</body>
</html>
