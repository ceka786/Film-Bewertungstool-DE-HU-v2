<!doctype html>
<!--
  STREAMING-KATALÓGUS DE/HU – a weboldal (v3: filmek + sorozatok)
  ===============================================================
  Egyetlen fájl: HTML (szerkezet) + CSS (kinézet) + JavaScript (működés).
  Adatot nem gyűjt, csak beolvassa a data/movies.json és data/series.json
  fájlokat, amiket az update.py készít. A pipák és a szűrők a böngésződben
  tárolódnak. Bővebb magyarázat: DOKUMENTACIO.md
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streaming-Katalog DE & HU</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎞️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* ===== 1. SZÍNEK ÉS BETŰTÍPUS ============================================
   A :root a "gyökér", ide tesszük a változókat (--bg = háttér, --ink = szöveg).
   Így egy helyen átszínezhető az egész oldal. A sötét mód automatikusan
   átvált a telefon beállítása szerint (prefers-color-scheme). */
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#18212B; --muted:#5E6B78;
  --line:#CFD6DE; --lamp:#F2B632; --lamp-ink:#3A2A00; --off:#9AA5B1;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151B; --surface:#1A222B; --ink:#E8EDF2; --muted:#93A1AF;
    --line:#2C3743; --lamp:#F2B632; --lamp-ink:#231900; --off:#56626E;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B; --surface:#1A222B; --ink:#E8EDF2; --muted:#93A1AF;
  --line:#2C3743; --lamp:#F2B632; --lamp-ink:#231900; --off:#56626E;
}
/* ===== 2. ALAPOK ======================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
img{max-width:100%}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;line-height:.95;letter-spacing:-.02em;margin:0}
h1 small{display:block;font-size:.38em;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:.5em}
/* ===== 3. FEJLÉC ÉS SZŰRŐSÁV =========================================== */
.controls{background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
.controls-inner{max-width:760px;margin:0 auto;display:grid;gap:8px}
input[type=search],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
/* Filmek | Sorozatok fül – a legfontosabb választás, ezért a legnagyobb */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:2px solid var(--line)}
.kinds button{font:inherit;font-size:20px;font-weight:800;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:8px 0 10px;color:var(--muted);cursor:pointer}
.kinds button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
/* a fül szerint eltűnő elemek */
body[data-kind=tv] .only-movie, body[data-kind=movie] .only-tv{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* rendezés + irány-gomb egy cellában */
.sortrow{display:grid;grid-template-columns:1fr auto;gap:6px}
#dir{font:inherit;font-size:18px;width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
/* számláló-sor: szűrők törlése + találat/oldal */
.statbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.statbar select{width:auto;padding:8px 10px;font-size:14px}
/* lapozó a lista fölött és alatt */
.pager{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.pager:empty{display:none}
.pager button{font:inherit;font-size:18px;min-width:44px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
/* elrejtett, de a kapcsolóval megjelenített sor */
.film.hid{opacity:.5}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--ink)}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.lang{display:flex;gap:4px;justify-content:flex-end;margin-bottom:10px}
.lang button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{max-width:760px;margin:0 auto;padding:10px 16px 0;color:var(--muted);font-size:14px}
main{max-width:760px;margin:0 auto;padding:6px 8px 40px}
/* szolgáltató-kapcsolók a szűrősávban */
.svcbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.svc{font:inherit;font-size:12px;line-height:1.15;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 2px;cursor:pointer}
.svc img{width:28px;height:28px;border-radius:6px;filter:grayscale(1);opacity:.45}
.svc[aria-pressed=true]{border:2px solid var(--ink);color:var(--ink);font-weight:600;padding:6px 1px}
.svc[aria-pressed=true] img{filter:none;opacity:1}
#resetAll{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
/* ===== 4. EGY SOR (poszter | cím | pontszámok) ========================== */
.film{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.poster{width:54px;height:81px;border-radius:5px;background:var(--line);object-fit:cover;display:block}
.title{font-weight:600;font-size:17px;line-height:1.2}
.meta{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.flags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.flag{font-size:13px;border-radius:6px;padding:2px 7px;border:1px solid var(--line);background:var(--surface)}
.flag.off{color:#C0392B;text-decoration:line-through;background:none;border-color:#C0392B}
.flag.off::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#C0392B;margin-right:5px;vertical-align:middle}
/* szolgáltató-logók a zászló mellett; a már nem elérhető logó szürke és halvány */
.flag img{width:18px;height:18px;border-radius:4px;vertical-align:-4px;margin-left:4px}
.flag img.off{filter:grayscale(1);opacity:.35}
.flag .svct{font-size:11px;font-weight:600;margin-left:4px}
.flag .svct.off{opacity:.4}
.scores{display:grid;gap:4px;justify-items:end;text-align:right}
.imdb{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.imdb.hi{background:var(--lamp);color:var(--lamp-ink);border-radius:6px;padding:2px 6px}
.sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.combo{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.gtag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:none}
.new{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;background:var(--lamp);color:var(--lamp-ink)}
.newseason{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;background:#1F7A8C;color:#fff}
.recbadge{font-size:12px;font-weight:600;border-radius:6px;padding:2px 6px;background:#6C4FB8;color:#fff}
/* gombok a sorban: láttam / megnézem / ajánlom */
.seen,.star,.rec{font:inherit;font-size:13px;border-radius:6px;padding:2px 8px;border:1px dashed var(--muted);background:none;color:var(--muted);cursor:pointer}
.seen[aria-pressed=true]{border:1px solid #2E9E5B;background:#2E9E5B;color:#fff}
.star[aria-pressed=true]{border:1px solid #C98A00;background:#C98A00;color:#fff}
.rec[aria-pressed=true]{border:1px solid #6C4FB8;background:#6C4FB8;color:#fff}
/* elrejtés (✕): kicsi kör a pontszám-oszlop tetején */
.hide{font:inherit;font-size:13px;line-height:1;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;padding:0}
.hide:hover{border-color:#C0392B;color:#C0392B}
.pw{position:relative;display:block;width:54px}
.tick{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:#2E9E5B;color:#fff;font-size:12px;line-height:20px;text-align:center;border:2px solid var(--bg)}
.film.watched .title{color:var(--muted)}
.film a{color:inherit;text-decoration:none}
.film.gone{opacity:.42;filter:grayscale(1)}
.film.gone .imdb.hi{background:none;color:inherit;padding:0}
/* évadok lenyitható listája a sorozatoknál */
details.seasons{margin-top:6px;font-size:13px}
details.seasons summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
details.seasons summary::-webkit-details-marker{display:none}
details.seasons summary::after{content:" ▾"}
details.seasons[open] summary::after{content:" ▴"}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:5px 2px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.srow:last-child{border-bottom:0}
.srow b{font-weight:600}
.srow .sv{color:var(--muted)}
/* ===== 5. "NYELV ÉS ORSZÁG" PANEL (a pipa/x gombok) ===================== */
details.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.panel summary{font-size:15px;cursor:pointer;list-style:none}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:" ▾";color:var(--muted)}
details.panel[open] summary::after{content:" ▴"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:5px 9px;cursor:pointer}
.chip[data-s="1"]{border-color:#2E9E5B;background:#2E9E5B;color:#fff}
.chip[data-s="2"]{border-color:#C0392B;background:#C0392B;color:#fff}
.plabel{font-size:13px;color:var(--muted);margin-top:8px}
/* ===== 5b. TRENDSÁV (a cím alatt, vízszintesen görgethető) =============== */
.trends{max-width:760px;margin:0 auto;padding:4px 0 12px}
.trhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 8px}
.trhead h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.trsw{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.trsw button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);padding:5px 12px;cursor:pointer}
.trsw button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}
.trrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;padding:0 16px 6px;scrollbar-width:none}
.trrow::-webkit-scrollbar{display:none}
.trc{flex:0 0 118px;scroll-snap-align:start;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.trc img.tp,.trc .tp{width:118px;height:177px;border-radius:8px;object-fit:cover;display:block;background:var(--line)}
.trc .tt{font-weight:600;font-size:14px;line-height:1.2;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trc .ts{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.trc .tl img{width:16px;height:16px;border-radius:3px;margin:3px 3px 0 0}
/* ===== 5c. ADATLAP (felugró ablak) ======================================= */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet-box{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px 28px}
@media (min-width:700px){.sheet{align-items:center}.sheet-box{border-radius:16px}}
.sheet-x{position:sticky;top:0;float:right;font:inherit;font-size:18px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sh-top{display:grid;grid-template-columns:110px 1fr;gap:14px;margin-top:6px}
.sh-top>img,.sh-top>.tp{width:110px;height:165px;border-radius:8px;object-fit:cover;background:var(--line)}
.sh-title{font-size:22px;font-weight:800;line-height:1.1;margin:0 0 4px}
.sh-scores{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;font-variant-numeric:tabular-nums;font-size:14px}
.sh-scores b{font-size:20px}
.sh-sec{margin-top:14px;font-size:15px;line-height:1.5}
.sh-sec h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 2px}
.sh-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sh-links a,.sh-links button{font:inherit;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.sh-links .yt{background:#C4302B;border-color:#C4302B;color:#fff;font-weight:600}
.sh-links .again{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
/* ===== 5d. LENYÍLÓ ADATLAP (a lista sora alatt és a trendsor alatt) ======= */
.film{cursor:pointer}
.film.open{background:var(--surface);border-bottom-color:transparent;border-radius:10px 10px 0 0}
.exp{background:var(--surface);border-bottom:1px solid var(--line);border-radius:0 0 10px 10px;padding:0 12px 14px 74px;animation:expin .18s ease-out}
.exp .sh-sec:first-child{margin-top:0}
.exp .sh-links{margin-top:12px}
@keyframes expin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (max-width:420px){.exp{padding-left:12px}}
.trc.sel .tp{outline:3px solid var(--lamp);outline-offset:2px}
.trdet{position:relative;margin:8px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;animation:expin .18s ease-out}
.trdet .sheet-x{position:absolute;top:10px;right:10px;float:none}
.trdet .sh-top{margin-top:0;padding-right:40px}
.trdet .sh-top>img,.trdet .sh-top>.tp{width:90px;height:135px}
@media (prefers-reduced-motion:reduce){.exp,.trdet{animation:none}}
#dice{font:inherit;font-size:20px;width:42px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;line-height:1}
.statleft{display:flex;gap:8px;align-items:center}
/* ===== 6. LÁBLÉC ======================================================== */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
footer details.panel{margin-bottom:14px;font-size:14px;color:var(--ink)}
.tools button,.tools label{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.empty,.error{padding:40px 16px;text-align:center;color:var(--muted)}
#more{height:1px}
footer{max-width:760px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}
footer a{color:inherit}
.tmdblogo{height:11px;width:auto;vertical-align:0;margin-right:6px}
@media (min-width:600px){.controls-inner{grid-template-columns:1fr 1fr}.controls-inner>.full{grid-column:1/-1}}
</style>
</head>
<body data-kind="movie">
<header>
  <div class="lang" role="group" aria-label="Sprache / Nyelv">
    <button data-l="de">DE</button><button data-l="hu">HU</button>
  </div>
  <h1><span data-i="h1"></span><small data-i="sub"></small></h1>
</header>

<!-- Trendsáv: a hét trendjei az adott ország kínálatából; a szűrőktől független -->
<section class="trends" id="trends" hidden>
  <div class="trhead">
    <h2 data-i="trTitle"></h2>
    <div class="trsw" role="group" aria-label="Land">
      <button data-tc="DE">🇩🇪 DE</button><button data-tc="HU">🇭🇺 HU</button>
    </div>
  </div>
  <div class="trrow" id="trRow"></div>
  <!-- a kattintott trend adatlapja ide nyílik le, a teljes sor alá -->
  <div class="trdet" id="trDet" hidden></div>
</section>

<div class="controls">
  <div class="controls-inner">
    <!-- Filmek | Sorozatok: soha nem keverednek, a szűrők is ehhez igazodnak -->
    <div class="kinds full" role="group" aria-label="Filme / Serien">
      <button data-k="movie" data-i="tabMovie"></button>
      <button data-k="tv" data-i="tabTv"></button>
    </div>
    <input class="full" type="search" id="q" data-i-ph="search">
    <!-- Kínálat: melyik ország streaming-műsora számít (NEM a nyelv és NEM a szinkron) -->
    <select id="country" class="full" aria-label="Angebot / Kínálat">
      <option value="ALL" data-i="ctry_all"></option>
      <option value="DE" data-i="ctry_de"></option>
      <option value="HU" data-i="ctry_hu"></option>
      <option value="BOTH" data-i="ctry_both"></option>
    </select>
    <div class="svcbar full" id="svcBar" role="group" aria-label="Streaming"></div>
    <div class="sortrow full">
      <select id="sort" aria-label="Sortierung"></select>
      <button id="dir" type="button">↓</button>
    </div>
    <select id="votes" class="full" aria-label="Mindestanzahl IMDb-Stimmen">
        <option value="0" data-i="v0"></option>
        <option value="1000"></option>
        <option value="10000"></option>
        <option value="100000"></option>
      </select>
    <div class="row2">
      <select id="yFrom" aria-label="Jahr von"></select>
      <select id="yTo" aria-label="Jahr bis"></select>
    </div>
    <div class="row2">
      <select id="genre" aria-label="Genre"></select>
      <!-- csak filmeknél: játékidő -->
      <select id="runtime" class="only-movie" aria-label="Laufzeit">
        <option value="" data-i="rt_any"></option>
        <option value="0-90" data-i="rt_90"></option>
        <option value="0-120" data-i="rt_120"></option>
        <option value="120-999" data-i="rt_long"></option>
      </select>
      <!-- csak sorozatoknál: évadok száma -->
      <select id="seasons" class="only-tv" aria-label="Staffeln">
        <option value="" data-i="se_any"></option>
        <option value="1-1" data-i="se_1"></option>
        <option value="2-3" data-i="se_23"></option>
        <option value="4-999" data-i="se_4"></option>
      </select>
    </div>
    <!-- csak sorozatoknál: állapot -->
    <select id="status" class="full only-tv" aria-label="Status">
      <option value="" data-i="st_any"></option>
      <option value="run" data-i="st_run"></option>
      <option value="end" data-i="st_end"></option>
    </select>
    <details class="panel full">
      <summary data-i="panelTitle"></summary>
      <div class="plabel" data-i="panelHint"></div>
      <div class="plabel" data-i="langLabel"></div>
      <div class="chips" id="langChips"></div>
      <div class="plabel" data-i="countryLabel"></div>
      <div class="chips" id="countryChips"></div>
      <button class="chip" id="resetPicks" data-i="resetPicks" style="margin-top:8px"></button>
    </details>
    <select id="seenFilter" class="full" aria-label="Gesehen">
      <option value="all" data-i="sf_all"></option>
      <option value="no" data-i="sf_no"></option>
      <option value="yes" data-i="sf_yes"></option>
    </select>
    <select id="listFilter" class="full" aria-label="Liste">
      <option value="all" data-i="l_all"></option>
      <option value="watch" data-i="l_watch"></option>
      <option value="rec" data-i="l_rec"></option>
    </select>
    <label class="toggle full"><input type="checkbox" id="onlyNew"> <span data-i="onlyNew"></span></label>
    <label class="toggle full only-tv"><input type="checkbox" id="newSeason"> <span data-i="newSeason"></span></label>
    <label class="toggle full"><input type="checkbox" id="showGone" checked> <span data-i="showGone"></span></label>
    <label class="toggle full"><input type="checkbox" id="showHidden"> <span data-i="showHidden"></span></label>
  </div>
</div>

<div class="stats statbar">
  <div class="statleft">

<script>
/* ===== 1. SEGÉDESZKÖZÖK ==================================================
   $   = rövidítés elemek megkeresésére ("query selector")
   load/store = biztonságos olvasás/írás a böngésző tárolójába (localStorage) */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const load = (k, def = {}) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def } catch(e){ return def } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => v == null ? -Infinity : v;
const today = () => new Date().toISOString().slice(0,10);
const daysAgo = n => new Date(Date.now() - n*864e5).toISOString().slice(0,10);

/* ===== 2. SZÖVEGEK KÉT NYELVEN ===========================================

    trTitle:"A hét trendi filmjei", trTitle_tv:"A hét trendi sorozatai", s_pop:"Népszerű most",

    impCsvHint:"IMDb: Your Ratings → ⋯ → Export. Letterboxd: Settings → Data → Export (watched.csv). Netflix: Fiók → Profil → Megtekintési tevékenység → Összes letöltése.",

    v0:"Szavazat: mind", vN:n=>`min. ${n} szavazat`, yFrom:"Évtől", yTo:"Évig", yAny:"mind", g_any:"Minden műfaj",
    rt_any:"Hossz: mind", rt_90:"max. 90 perc", rt_120:"max. 2 óra", rt_long:"2 óránál hosszabb",
    se_any:"Évadok: mind", se_1:"1 évad", se_23:"2–3 évad", se_4:"4+ évad",

    langLabel:"Eredeti nyelv", countryLabel:"Gyártó ország", resetPicks:"Választás törlése", picksActive:n=>` ${n} aktív`,

    l_all:"Minden film", l_all_tv:"Minden sorozat", l_watch:"Csak a listám", l_rec:"Csak az ajánlásaim",
    l_hidden:"Elrejtett filmek", l_hidden_tv:"Elrejtett sorozatok",
    onlyNew:"Csak az elmúlt 7 nap újdonságai", newSeason:"Csak friss évaddal (elmúlt 6 hónap)",

    seen:"Láttam", watch:"Megnézem", rec:"Ajánlom", recBadge:"🍽 Ajánlott",
    newBadge:"ÚJ", newSeasonBadge:"ÚJ ÉVAD", hideT:"Elrejtés", unhideT:"Visszahozás",
    min:"perc", seasonsN:n=>`${n} évad`, episodes:n=>`${n} rész`,
    seasonRow:n=>`${n}. évad`, running:"fut",
    resetAll:n=>n ? `Szűrők törlése (${n} aktív)` : "Nincs aktív szűrő",

/* ===== 3. ÁLLAPOT ========================================================
   kind  = "movie" vagy "tv" – melyik fül van kiválasztva
   D     = a betöltött adatok fajtánként (csak az első megnyitáskor töltjük le)
   L     = a saját listáid fajtánként: seen (láttam), watch (megnézem),
           recs (ajánlom), hidden (elrejtett). A filmek a régi neveken maradnak,
           hogy a korábbi pipáid megmaradjanak; a sorozatok "tv_" előtagot kapnak.
   Minden a böngésző localStorage tárolójába mentődik. */
const KINDS = {
  movie: { file: "data/movies.json", key: "movies", pre: "" },
  tv:    { file: "data/series.json", key: "items",  pre: "tv_" },
};
const LIST_NAMES = ["seen", "watch", "recs", "hidden"];
let lang = load("lang", null) || (() => { try { return localStorage.getItem("lang") } catch(e){ return null } })()
  || ((navigator.language || "").toLowerCase().startsWith("hu") ? "hu" : "de");
if (lang !== "de" && lang !== "hu") lang = "de";
let kind = load("kind", "movie"); if (!KINDS[kind]) kind = "movie";
const D = {movie: null, tv: null};
const L = {};
for (const k in KINDS) { L[k] = {}; LIST_NAMES.forEach(n => L[k][n] = load(KINDS[k].pre + n)); }
const saveList = (k, n) => store(KINDS[k].pre + n, L[k][n]);
let recsRemote = {movie: {}, tv: {}};  // a repóban lévő ajanlasok.json – mindenki látja
let picks = load("picks"); picks.lang = picks.lang || {}; picks.country = picks.country || {};
let svcOn = load("svcOn");             // melyik szolgáltató van bekapcsolva (hiányzó = be)
let country = "ALL", view = [], shown = 0;
const PAGE = 60;                       // "Mind egyszerre" módban ennyi sor töltődik be görgetésenként
let pageSize = load("pageSize", "50");  // találat oldalanként (alap: 50), minden fülre közös
let page = 0, dir = "desc";             // aktuális oldal; rendezés iránya (fülenként mentve)
const IMG = "https://image.tmdb.org/t/p/w154", LOGO = "https://image.tmdb.org/t/p/w92";
const SVC_ORDER = ["netflix", "prime", "disney", "hbo", "apple"];

/* Szövegek: tk() a fülhöz illő változatot adja (pl. "Filme" vagy "Serien") */
const t = k => T[lang][k];
const tk = k => (kind === "tv" && T[lang][k + "_tv"] !== undefined) ? T[lang][k + "_tv"] : T[lang][k];
const nf = () => new Intl.NumberFormat(t("locale"));
const df = d => d ? new Date(d).toLocaleDateString(t("locale"), {day:"2-digit", month:"2-digit", year:"2-digit"}) : "";
const ttl = m => (lang === "hu" ? m.title_hu : m.title) || m.title || m.title_hu || m.orig || "";
const cur = () => D[kind];
const svcSel = k => svcOn[k] !== false;
const services = () => ({...(D.movie && D.movie.services), ...(D.tv && D.tv.services)});
const svcKeys = () => { const s = services(); return SVC_ORDER.filter(k => s[k]).concat(Object.keys(s).filter(k => !SVC_ORDER.includes(k))); };

/* ===== 4. SZÖVEGEK KIÍRÁSA ÉS LEGÖRDÜLŐK FELTÖLTÉSE =====================
   Ezek csak kirajzolnak, eseménykezelőt NEM regisztrálnak (az a 9. részben
   van, egyszer) – így nyelvváltáskor sem duplázódik semmi. */
function applyTexts(){
  document.documentElement.lang = lang;
  $$("[data-i]").forEach(el => el.textContent = tk(el.dataset.i));
  $$("[data-i-ph]").forEach(el => { el.placeholder = t(el.dataset.iPh); el.setAttribute("aria-label", t(el.dataset.iPh)); });
  $$("#votes option").forEach(o => { if (+o.value) o.textContent = t("vN")(nf().format(+o.value)); });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $$(".kinds button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === kind));
  document.body.dataset.kind = kind;
  document.title = t("h1");
  $$("#pageSize option").forEach(o => o.textContent = o.value === "all" ? t("allPage") : t("perPage")(o.value));
  $("#pageSize").value = pageSize;
  showDir();
  $("#dice").title = t("dice"); $("#dice").setAttribute("aria-label", t("dice"));
  fillSort(); fillYears(); fillGenres(); fillChips(); fillSvcBar(); renderTrends();
}
function fillSort(){
  const sel = $("#sort"), val = sel.value;
  const opts = kind === "tv"
    ? [["combo", t("s_combo")], ["pop", t("s_pop")], ["imdb", "IMDb"], ["tmdb", "TMDB"], ["rt", "Rotten Tomatoes"], ["mc", "Metacritic"],
       ["newseason", t("s_newseason")], ["year", tk("s_year")], ["added", t("s_added")], ["gone", t("s_gone")], ["title", t("s_title")]]
    : [["combo", t("s_combo")], ["pop", t("s_pop")], ["imdb", "IMDb"], ["rt", "Rotten Tomatoes"], ["mc", "Metacritic"],
       ["year", tk("s_year")], ["added", t("s_added")], ["gone", t("s_gone")], ["title", t("s_title")]];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
  sel.value = opts.some(o => o[0] === val) ? val : "combo";
}
function fillYears(){
  const years = cur() ? cur().years : [];
  for (const [id, key] of [["#yFrom","yFrom"], ["#yTo","yTo"]]) {
    const sel = $(id), val = sel.value;
    const list = key === "yTo" ? [...years].reverse() : years;
    sel.innerHTML = `<option value="">${t(key)}: ${t("yAny")}</option>` + list.map(y => `<option value="${y}">${t(key)}: ${y}</option>`).join("");
    sel.value = val; sel.setAttribute("aria-label", t(key));
  }
}
function fillGenres(){
  const sel = $("#genre"), val = sel.value, g = cur() ? cur().genres : {};
  const list = Object.entries(g).map(([id, n]) => [id, n[lang] || n.de || id]).sort((a, b) => a[1].localeCompare(b[1], lang));
  sel.innerHTML = `<option value="">${t("g_any")}</option>` + list.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join("");
  sel.value = val;
}
function fillSvcBar(){
  const s = services();
  $("#svcBar").innerHTML = svcKeys().map(k =>
    `<button class="svc" data-svc="${k}" aria-pressed="${svcSel(k)}">${s[k].logo ? `<img alt="" src="${LOGO}${s[k].logo}">` : ""}${esc(s[k].name || k)}</button>`).join("");
}

/* Nyelv/ország panel: minden tétel semleges → ✓ (csak ezek) → ✗ (kizárva) */
const dn = (type, code) => { try { return new Intl.DisplayNames([t("locale")], {type}).of(code) || code } catch(e){ return code } };
function chipList(key){
  const count = {};
  (cur() ? cur().all : []).forEach(m => { const v = m[key]; if (v) count[v] = (count[v] || 0) + 1; });
  return Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b));
}
function fillChips(){
  for (const [k, id] of [["lang", "#langChips"], ["country", "#countryChips"]]) {
    $(id).innerHTML = chipList(k).map(code => {
      const st = picks[k][code] || 0;
      const name = k === "lang" ? dn("language", code) : dn("region", code);
      return `<button class="chip" data-kind="${k}" data-code="${code}" data-s="${st}">${st === 1 ? "✓ " : st === 2 ? "✗ " : ""}${esc(name)}</button>`;
    }).join("");
  }
  const n = Object.values(picks.lang).filter(Boolean).length + Object.values(picks.country).filter(Boolean).length;
  $("details.panel summary").textContent = t("panelTitle") + (n ? t("picksActive")(n) : "");
}
function passPicks(m){
  for (const k of ["lang", "country"]) {
    const p = picks[k], v = m[k];
    const wanted = Object.keys(p).filter(c => p[c] === 1);
    if (v && p[v] === 2) return false;
    if (wanted.length && !(v && p[v] === 1)) return false;
  }
  return true;
}

/* ===== 5. SZŰRŐK MENTÉSE FÜLENKÉNT ======================================
   A filmek és a sorozatok szűrői külön mentődnek ("filters" és "tv_filters"). */
const CTRL = ["#sort","#votes","#seenFilter","#listFilter","#yFrom","#yTo","#genre","#runtime","#seasons","#status"];
const SWITCH = ["#onlyNew","#newSeason","#showGone","#showHidden"];
const DEFAULTS = {"#sort":"combo","#votes":"0","#seenFilter":"all","#listFilter":"all","#onlyNew":false,"#newSeason":false,"#showGone":true,"#showHidden":false};
function saveFilters(){
  const f = {country, dir};
  CTRL.forEach(id => f[id] = $(id).value);
  SWITCH.forEach(id => f[id] = $(id).checked);
  store(KINDS[kind].pre + "filters", f);
}
function restoreFilters(){
  const f = load(KINDS[kind].pre + "filters");
  country = f.country || "ALL"; $("#country").value = country;
  dir = f.dir === "asc" ? "asc" : "desc"; showDir();
  CTRL.forEach(id => { const v = f[id] ?? DEFAULTS[id] ?? ""; $(id).value = v; if ($(id).value !== v) $(id).value = DEFAULTS[id] ?? ""; });
  SWITCH.forEach(id => $(id).checked = f[id] ?? DEFAULTS[id]);
}
/* hány szűrő tér el az alapállapottól (csak az aktuális fülön látható szűrők) */
function activeFilters(){
  let n = (country !== "ALL") + !!$("#q").value.trim() + svcKeys().some(k => !svcSel(k));
  const ids = ["#votes","#seenFilter","#listFilter","#yFrom","#yTo","#genre"].concat(kind === "tv" ? ["#seasons","#status"] : ["#runtime"]);
  ids.forEach(id => { const v = $(id).value; if (v && v !== "all" && v !== "0") n++; });
  n += $("#onlyNew").checked + (kind === "tv" && $("#newSeason").checked) + !$("#showGone").checked + $("#showHidden").checked + (dir === "asc");
  n += Object.values(picks.lang).filter(Boolean).length + Object.values(picks.country).filter(Boolean).length;
  return n;
}
function resetAll(){
  country = "ALL"; $("#country").value = "ALL"; $("#q").value = "";
  dir = "desc"; showDir();
  CTRL.forEach(id => $(id).value = DEFAULTS[id] ?? "");
  SWITCH.forEach(id => $(id).checked = DEFAULTS[id]);
  picks = {lang: {}, country: {}}; store("picks", picks); fillChips();
  svcOn = {}; store("svcOn", svcOn); fillSvcBar();
  saveFilters(); apply();
}

/* ===== 6. ELÉRHETŐSÉG, ÚJDONSÁG, PONTSZÁM ===============================
   avail szerkezete: { "DE": { "netflix": {first, on, last, gone}, ... }, "HU": {...} }
   onIn   = egy bekapcsolt szolgáltatónál MOST elérhető az adott országban
   everIn = egy bekapcsolt szolgáltatónál valaha elérhető volt ott */
const onIn = (m, c) => Object.entries(m.avail[c] || {}).some(([k, a]) => svcSel(k) && a.on);
const everIn = (m, c) => Object.keys(m.avail[c] || {}).some(svcSel);
function isAvailable(m){
  if (country === "DE" || country === "HU") return onIn(m, country);
  if (country === "BOTH") return onIn(m, "DE") && onIn(m, "HU");
  return onIn(m, "DE") || onIn(m, "HU");
}
function inScope(m){
  if (country === "DE" || country === "HU") return everIn(m, country);
  if (country === "BOTH") return everIn(m, "DE") && everIn(m, "HU");
  return everIn(m, "DE") || everIn(m, "HU");
}
const lastGone = m => Object.values(m.avail).flatMap(r => Object.values(r)).map(a => a.gone || "").sort().pop() || "";
/* "ÚJ": egy bekapcsolt szolgáltatónál az elmúlt 7 napban jelent meg. A szolgáltató
   első figyelési napja (since) nem számít, különben minden újnak látszana. */
function isNew(m){
  const d = cur(), week = daysAgo(7);
  const cs = (country === "DE" || country === "HU") ? [country] : Object.keys(m.avail);
  return cs.some(c => Object.entries(m.avail[c] || {}).some(([k, a]) =>
    svcSel(k) && a.on && a.first && a.first >= week && a.first > (d.since[`${c}:${k}`] || d.initial)));
}
/* legutóbbi, már megjelent évad (a jövőbeli bejelentett évadot nem számoljuk) */
function lastSeason(m){
  const now = today();
  return (m.seasons || []).filter(s => s.date && s.date <= now).sort((a, b) => b.n - a.n)[0] || null;
}
/* "ÚJ ÉVAD": a legutóbbi évad (2. vagy későbbi) az elmúlt 6 hónapban jelent meg */
function isNewSeason(m){ const s = lastSeason(m); return !!s && s.n > 1 && s.date >= daysAgo(183); }
/* Kombi-pontszám 0–100: IMDb ×10, (sorozatnál TMDB ×10, ha legalább 20 szavazat), RT, MC átlaga */
function combo(m){
  const r = m.r || {}, v = [];
  if (r.imdb != null) v.push(r.imdb * 10);
  if (kind === "tv" && m.tmdb && (m.tmdb_n || 0) >= 20) v.push(m.tmdb * 10);
  if (r.rt != null) v.push(r.rt);
  if (r.mc != null) v.push(r.mc);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}
const tmdbScore = m => (m.tmdb && (m.tmdb_n || 0) >= 20) ? m.tmdb : null;

/* ===== 7. SZŰRÉS ÉS RENDEZÉS =============================================
   filter = kidobja, ami nem felel meg | sort = sorrendbe rakja */
function apply(){
  const d = cur(); if (!d) return;
  const {seen, watch, recs, hidden} = L[kind], rRemote = recsRemote[kind];
  const q = $("#q").value.trim().toLowerCase(), sort = $("#sort").value;
  const minVotes = +$("#votes").value, showGone = $("#showGone").checked;
  const yf = $("#yFrom").value, yt = $("#yTo").value, g = $("#genre").value;
  const lf = $("#listFilter").value, sf = $("#seenFilter").value;
  const rtv = $("#runtime").value, sev = $("#seasons").value, stv = $("#status").value;
  const showHidden = $("#showHidden").checked;
  const onlyNew = $("#onlyNew").checked, newSeason = kind === "tv" && $("#newSeason").checked;

  view = d.all.filter(m => {
    if (!inScope(m)) return false;
    m._on = isAvailable(m);
    if (!showGone && !m._on) return false;
    if ((yf || yt) && !m.year) return false;
    if (yf && m.year < yf) return false;
    if (yt && m.year > yt) return false;
    if (!passPicks(m)) return false;
    if (g && !(m.genres || []).includes(+g)) return false;
    if (kind === "movie" && rtv) { const [lo, hi] = rtv.split("-").map(Number); if (!m.runtime || m.runtime <= lo || m.runtime > hi) return false; }
    if (kind === "tv" && sev) { const [lo, hi] = sev.split("-").map(Number); if (!m.n_s || m.n_s < lo || m.n_s > hi) return false; }
    if (kind === "tv" && stv && m.status !== stv) return false;
    if (onlyNew && !isNew(m)) return false;
    if (newSeason && !isNewSeason(m)) return false;
    if (hidden[m.id] && !showHidden) return false;   // elrejtés: csak a kapcsolóval látszik
    if (lf === "watch" && !watch[m.id]) return false;
    if (lf === "rec" && !(recs[m.id] || rRemote[m.id])) return false;
    if (sf === "yes" && !seen[m.id]) return false;
    if (sf === "no" && seen[m.id]) return false;
    if (minVotes && ((m.r && m.r.votes) || 0) < minVotes) return false;
    if (q && !`${m.title || ""} ${m.title_hu || ""} ${m.orig || ""}`.toLowerCase().includes(q)) return false;
    return true;
  });

  const r = (m, k) => m.r ? num(m.r[k]) : -Infinity;
  const ls = m => (lastSeason(m) || {}).date || "";
  const cmp = {
    combo: (a, b) => num(combo(b)) - num(combo(a)) || r(b, "votes") - r(a, "votes"),
    imdb:  (a, b) => r(b, "imdb") - r(a, "imdb") || r(b, "votes") - r(a, "votes"),
    tmdb:  (a, b) => num(tmdbScore(b)) - num(tmdbScore(a)) || (b.tmdb_n || 0) - (a.tmdb_n || 0),
    pop:   (a, b) => (b.pop || 0) - (a.pop || 0),
    rt:    (a, b) => r(b, "rt") - r(a, "rt") || r(b, "imdb") - r(a, "imdb"),
    mc:    (a, b) => r(b, "mc") - r(a, "mc") || r(b, "imdb") - r(a, "imdb"),
    newseason: (a, b) => ls(b).localeCompare(ls(a)),
    year:  (a, b) => (b.year || "").localeCompare(a.year || ""),
    added: (a, b) => (b.added || "").localeCompare(a.added || ""),
    gone:  (a, b) => lastGone(b).localeCompare(lastGone(a)),
    title: (a, b) => ttl(a).localeCompare(ttl(b), lang),
  }[sort] || (() => 0);
  // az elérhetők előre, kivéve a "Nemrég eltávolítva" rendezésnél
  // "↑" (növekvő) a rendezést fordítja meg; az elérhetők így is elöl maradnak
  // ami nem rendelkezik az adott értékkel (pl. nincs pontszám), mindig a végére kerül
  const val = {combo, imdb: m => m.r && m.r.imdb, tmdb: tmdbScore, rt: m => m.r && m.r.rt, mc: m => m.r && m.r.mc,
               pop: m => m.pop || null, newseason: m => ls(m) || null, year: m => m.year, added: m => m.added, gone: m => lastGone(m) || null}[sort];
  const miss = m => val ? val(m) == null : false;
  const c = (a, b) => (miss(a) - miss(b)) || (dir === "asc" ? cmp(b, a) : cmp(a, b));
  view.sort((a, b) => (sort !== "gone" && (b._on - a._on)) || c(a, b));

  updateStats();
  page = 0; render();
}
/* ===== 7b. MEGJELENÍTÉS OLDALANKÉNT ======================================
   pageSize = 10/25/50/100 → egyszerre egy oldal, lapozóval
   pageSize = "all"        → minden, görgetésre töltődik (a telefon miatt adagokban) */
let listOpen = null;   // a listában épp lenyitott cím azonosítója (szövegként)
let trOpen = null;     // a trendsor alatt nyitott cím: {k: fajta, id}
function render(){
  shown = 0; listOpen = null;   // újrarajzoláskor a lenyitott adatlap becsukódik
  $("#list").innerHTML = view.length ? "" : `<p class="empty">${t("empty")}</p>`;
  if (pageSize === "all") { $("#pagerTop").innerHTML = $("#pagerBot").innerHTML = ""; renderMore(); return; }
  const size = +pageSize, pages = Math.max(1, Math.ceil(view.length / size));
  page = Math.min(page, pages - 1);
  $("#list").insertAdjacentHTML("beforeend", view.slice(page * size, (page + 1) * size).map(card).join(""));
  shown = view.length;   // a görgetéses betöltés ilyenkor ne tegyen hozzá semmit
  const html = pages > 1
    ? `<button data-p="-1" aria-label="${t("prev")}" ${page === 0 ? "disabled" : ""}>‹</button><span>${t("pageOf")(page + 1, pages)}</span><button data-p="1" aria-label="${t("next")}" ${page >= pages - 1 ? "disabled" : ""}>›</button>`
    : "";
  $("#pagerTop").innerHTML = $("#pagerBot").innerHTML = html;
}
function showDir(){
  $("#dir").textContent = dir === "asc" ? "↑" : "↓";
  $("#dir").title = t(dir === "asc" ? "dirAsc" : "dirDesc");
  $("#dir").setAttribute("aria-label", $("#dir").title);
}
function updateStats(){
  const d = cur();
  $("#resetAll").textContent = t("resetAll")(activeFilters());
  if (!d) return;
  const avail = view.filter(m => m._on).length;
  $("#stats").textContent = tk("stats")(nf().format(view.length), nf().format(avail))
    + (d.updated ? t("stand")(new Date(d.updated).toLocaleString(t("locale"), {dateStyle: "short", timeStyle: "short"})) : "");
}

/* ===== 8. EGY SOR KIRAJZOLÁSA ============================================
   Szövegből épít HTML-t. Az esc() védi az oldalt a különleges karakterektől. */
function flag(m, c, label){
  const reg = m.avail[c]; if (!reg) return "";
  const s = services();
  const list = Object.entries(reg).sort((x, y) => SVC_ORDER.indexOf(x[0]) - SVC_ORDER.indexOf(y[0]));
  const logos = list.map(([k, a]) => {
    const sv = s[k] || {name: k};
    const tip = `${sv.name || k}: ${a.on ? t("since")(df(a.first)) : t("removed")(df(a.gone))}`;
    return sv.logo
      ? `<img class="${a.on ? "" : "off"}" alt="${esc(sv.name || k)}" title="${esc(tip)}" src="${LOGO}${sv.logo}">`
      : `<span class="svct${a.on ? "" : " off"}" title="${esc(tip)}">${esc(sv.name || k)}</span>`;
  }).join("");
  if (list.some(([, a]) => a.on)) return `<span class="flag">${label}${logos}</span>`;
  const gone = list.map(([, a]) => a.gone || "").sort().pop();
  return `<span class="flag off">${label}${logos} ${t("until")(df(gone))}</span>`;
}
const gtags = m => (m.genres || []).map(id => { const n = cur().genres[id]; return n ? (n[lang] || n.de) : null; })
  .filter(Boolean).slice(0, 2).map(n => `<span class="gtag">${esc(n)}</span>`).join("");
/* a meta-sor: filmnél "1999, 139 perc", sorozatnál "2019–2023, 3 évad, 24 rész" */
function meta(m){
  const orig = m.orig && m.orig !== ttl(m) ? `, ${esc(m.orig)}` : "";
  if (kind === "movie") return `${esc(m.year || "")}${m.runtime ? `, ${m.runtime} ${t("min")}` : ""}${orig}`;
  const years = m.year ? (m.status === "end" ? (m.end && m.end !== m.year ? `${m.year}–${m.end}` : m.year) : `${m.year}– (${t("running")})`) : "";
  return [years, m.n_s ? t("seasonsN")(m.n_s) : "", m.n_e ? t("episodes")(m.n_e) : ""].filter(Boolean).join(", ") + orig;
}
/* évadok lenyitható listája: "2. évad · 2021 · 8 rész · TMDB 8.1" */
function seasonsBlock(m){
  if (kind !== "tv" || !(m.seasons || []).length) return "";
  const rows = [...m.seasons].sort((a, b) => a.n - b.n).map(s =>
    `<div class="srow"><b>${t("seasonRow")(s.n)}</b><span>${s.date ? s.date.slice(0, 4) : "–"}${s.ep ? ` · ${t("episodes")(s.ep)}` : ""}</span><span class="sv">${s.vote ? `TMDB ${s.vote.toFixed(1)}` : "–"}</span></div>`).join("");
  return `<details class="seasons"><summary>${t("seasonsN")(m.seasons.length)}</summary>${rows}</details>`;
}
function card(m){
  const {seen, watch, recs, hidden} = L[kind];
  const r = m.r || {};
  const imdb = r.imdb != null ? r.imdb.toFixed(1) : "–";
  const hi = r.imdb >= 7.5 ? " hi" : "";
  const link = m.imdb_id ? `https://www.imdb.com/title/${m.imdb_id}/` : `https://www.themoviedb.org/${kind}/${m.id}`;
  const w = !!seen[m.id], wl = !!watch[m.id], rc = !!(recs[m.id] || recsRemote[kind][m.id]), hd = !!hidden[m.id];
  const ts = kind === "tv" ? tmdbScore(m) : null;
  return `<div class="film${m._on ? "" : " gone"}${w ? " watched" : ""}${hd ? " hid" : ""}${listOpen === String(m.id) ? " open" : ""}" data-id="${m.id}">
    <a class="pw" href="${link}" target="_blank" rel="noopener" data-open="${m.id}">${m.poster ? `<img class="poster" loading="lazy" alt="" src="${IMG}${m.poster}">` : `<div class="poster"></div>`}${w ? `<span class="tick" aria-hidden="true">✓</span>` : ""}</a>
    <div>
      <a class="title" href="${link}" target="_blank" rel="noopener" data-open="${m.id}">${esc(ttl(m))}</a>
      <div class="meta">${meta(m)}</div>
      <div class="flags">${isNew(m) ? `<span class="new">${t("newBadge")}</span>` : ""}${kind === "tv" && isNewSeason(m) ? `<span class="newseason">${t("newSeasonBadge")}</span>` : ""}${rc ? `<span class="recbadge">${t("recBadge")}</span>` : ""}${flag(m, "DE", "🇩🇪")}${flag(m, "HU", "🇭🇺")}${gtags(m)}<button class="seen" aria-pressed="${w}">${w ? "✓ " : ""}${t("seen")}</button><button class="star" aria-pressed="${wl}">${wl ? "★ " : "☆ "}${t("watch")}</button><button class="rec" aria-pressed="${!!recs[m.id]}">${t("rec")}</button></div>
      ${seasonsBlock(m)}
    </div>
    <div class="scores">
      <button class="hide" title="${hd ? t("unhideT") : t("hideT")}" aria-label="${hd ? t("unhideT") : t("hideT")}">${hd ? "↺" : "✕"}</button>
      <div class="imdb${hi}" title="IMDb">${imdb}</div>
      <div class="combo" title="${t("s_combo")}">Ø ${combo(m) ?? "–"}</div>
      ${kind === "tv" ? `<div class="sub">TMDB ${ts != null ? ts.toFixed(1) : "–"}</div>` : ""}
      <div class="sub">🍅 ${r.rt != null ? r.rt + "%" : "–"}</div>
      <div class="sub">MC ${r.mc != null ? r.mc : "–"}</div>
    </div>
  </div>`;
}
/* Fokozatos betöltés: egyszerre csak 60 sort rajzolunk ki. Ha az oldal aljára
   érsz (IntersectionObserver figyeli), jön a következő adag. */
function renderMore(){
  const chunk = view.slice(shown, shown + PAGE);
  $("#list").insertAdjacentHTML("beforeend", chunk.map(card).join(""));
  shown += chunk.length;
}
new IntersectionObserver(e => { if (e[0].isIntersecting && shown < view.length) renderMore(); }, {rootMargin: "800px"}).observe($("#more"));

/* ===== 9. ESEMÉNYKEZELŐK – mind EGYSZER regisztrálva ===================== */

// gombok a sorokban: ✕ elrejtés, ⭐ megnézem, 🍽 ajánlom, ✓ láttam

// listák mentése fájlba: filmek a gyökérben (régi formátum), sorozatok a "tv" alatt

function download(name, obj){

  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], {type: "application/json"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ===== 9b. TRENDSÁV =======================================================
   A heti trendlista sorrendjében azok a címek, amik a kiválasztott országban
   most elérhetők (bármelyik szolgáltatónál). A szűrők, a látott és az elrejtett
   címek nem hatnak rá. */
let trC = load("trC", null) || (lang === "hu" ? "HU" : "DE");
function renderTrends(){
  const d = cur(), box = $("#trends");
  $$(".trsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tc === trC));
  if (!d) { box.hidden = true; return; }
  const s = services();
  const list = d.trending.map(id => d.byId[id])
    .filter(m => m && Object.values(m.avail[trC] || {}).some(a => a.on)).slice(0, 20);
  box.hidden = !list.length;
  // a nyitott trend-adatlap marad, ha a cím még a sorban van; különben becsukódik
  if (trOpen && (trOpen.k !== kind || !list.some(m => String(m.id) === trOpen.id))) closeTr();
  $("#trRow").innerHTML = list.map(m => {
    const r = m.r || {}, c = combo(m);
    const logos = Object.entries(m.avail[trC]).filter(([, a]) => a.on)
      .sort((x, y) => SVC_ORDER.indexOf(x[0]) - SVC_ORDER.indexOf(y[0]))
      .map(([k]) => s[k] && s[k].logo ? `<img alt="${esc(s[k].name)}" src="${LOGO}${s[k].logo}">` : "").join("");
    return `<button class="trc" data-open="${m.id}">
      ${m.poster ? `<img class="tp" loading="lazy" alt="" src="https://image.tmdb.org/t/p/w185${m.poster}">` : `<div class="tp"></div>`}
      <div class="tt">${esc(ttl(m))}</div>
      <div class="ts">IMDb ${r.imdb != null ? r.imdb.toFixed(1) : "–"} · Ø ${c ?? "–"}</div>
      <div class="tl">${logos}</div></button>`;
  }).join("");
  markTr(); if (trOpen) refreshTr();   // nyelvváltáskor a nyitott adatlap is átvált
}
$$(".trsw button").forEach(b => b.addEventListener("click", () => { trC = b.dataset.tc; store("trC", trC); renderTrends(); }));
$("#trRow").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openTr(b.dataset.open); });
$("#trDet").addEventListener("click", e => {
  if (e.target.closest(".sheet-x")) { closeTr(); return; }
  const btn = e.target.closest(".star, .rec, .seen"); if (btn && trOpen) toggleMark(trOpen.id, btn);
});
/* Trend-adatlap: a teljes trendsor alatt nyílik le. Másik trendre kattintva
   a tartalma cserélődik, ugyanarra (vagy a ✕-re) kattintva becsukódik. */
function openTr(id){
  if (trOpen && trOpen.k === kind && trOpen.id === id) { closeTr(); return; }
  if (!cur().byId[id]) return;
  trOpen = {k: kind, id};
  markTr(); $("#trDet").hidden = false; $("#trDet").innerHTML = ""; refreshTr();
  $("#trDet").scrollIntoView({block: "nearest", behavior: "smooth"});
}
function refreshTr(){
  const m = cur() && cur().byId[trOpen.id]; if (!m) { closeTr(); return; }
  m._on = isAvailable(m);
  const draw = x => $("#trDet").innerHTML =
    `<button class="sheet-x" type="button" title="${t("close")}" aria-label="${t("close")}">✕</button>`
    + detHead(m) + detBody(m, x) + seasonsBlock(m) + detLinks(m, x);
  if (!$("#trDet").innerHTML) draw({loading: true});
  const {k, id} = trOpen;
  loadDetails(k, id).then(x => { if (trOpen && trOpen.id === id && kind === k) draw(x); });
}
function closeTr(){ trOpen = null; $("#trDet").hidden = true; $("#trDet").innerHTML = ""; markTr(); }
function markTr(){ $$("#trRow .trc").forEach(b => b.classList.toggle("sel", !!trOpen && b.dataset.open === trOpen.id)); }

/* ===== 9c. ADATLAP ========================================================
   Az adatlapok 100 kis fájlban vannak (data/details/<fajta>/00.json … 99.json,
   az azonosító utolsó két számjegye szerint). Csak a kellő fájlt töltjük le. */
function loadDetails(k, id){
  const n = String(+id % 100).padStart(2, "0"), d = D[k];
  if (!d.det[n]) d.det[n] = fetch(`data/details/${k}/${n}.json`, {cache: "no-cache"}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  return d.det[n].then(sh => sh[String(id)] || {});
}
let sheetM = null, sheetDice = false;
function openSheet(m, fromDice = false){
  if (!m) return;
  sheetM = m; sheetDice = fromDice;
  m._on = isAvailable(m);
  $("#sheet").hidden = false; document.body.style.overflow = "hidden";
  renderSheet({loading: true});
  const k = kind;
  loadDetails(k, m.id).then(x => { if (sheetM === m && kind === k) renderSheet(x); });
}
function closeSheet(){ $("#sheet").hidden = true; document.body.style.overflow = ""; sheetM = null; }
/* Az adatlap három része – a felugró ablak (🎲), a trend-panel és a lista
   lenyíló része ugyanezekből épül:
   detHead = poszter, cím, pontszámok, zászlók, gombok (a lista sorában ez már látszik)
   detBody = történet, rendező/alkotó, szereplők
   detLinks = előzetes, IMDb, TMDB (+ a kockánál „Másikat”) */
function detHead(m){
  const r = m.r || {}, {seen, watch, recs} = L[kind];
  const genres = (m.genres || []).map(id => { const n = cur().genres[id]; return n ? (n[lang] || n.de) : null; }).filter(Boolean);
  const ts = kind === "tv" ? tmdbScore(m) : null;
  const w = !!seen[m.id], wl = !!watch[m.id], rc = !!recs[m.id];
  return `
    <div class="sh-top" data-id="${m.id}">
      ${m.poster ? `<img alt="" src="https://image.tmdb.org/t/p/w342${m.poster}">` : `<div class="tp"></div>`}
      <div>
        <h2 class="sh-title">${esc(ttl(m))}</h2>
        <div class="meta">${meta(m)}</div>
        <div class="flags">${genres.map(g => `<span class="gtag">${esc(g)}</span>`).join("")}</div>
        <div class="sh-scores"><span>IMDb <b>${r.imdb != null ? r.imdb.toFixed(1) : "–"}</b></span><span>Ø <b>${combo(m) ?? "–"}</b></span>${kind === "tv" ? `<span>TMDB ${ts != null ? ts.toFixed(1) : "–"}</span>` : ""}<span>🍅 ${r.rt != null ? r.rt + "%" : "–"}</span><span>MC ${r.mc ?? "–"}</span></div>
        <div class="flags">${flag(m, "DE", "🇩🇪")}${flag(m, "HU", "🇭🇺")}</div>
        <div class="flags"><button class="seen" aria-pressed="${w}">${w ? "✓ " : ""}${t("seen")}</button><button class="star" aria-pressed="${wl}">${wl ? "★ " : "☆ "}${t("watch")}</button><button class="rec" aria-pressed="${rc}">${t("rec")}</button></div>
      </div>
    </div>`;
}
function detBody(m, x){
  const ov = x.loading ? t("loadingDet") : ((lang === "hu" ? (x.ov_hu || x.ov_de) : (x.ov_de || x.ov_hu)) || t("noOverview"));
  return `
    <div class="sh-sec"><h3>${t("overview")}</h3>${esc(ov)}</div>
    ${x.crew && x.crew.length ? `<div class="sh-sec"><h3>${t(kind === "tv" ? "creator" : "director")}</h3>${esc(x.crew.join(", "))}</div>` : ""}
    ${x.cast && x.cast.length ? `<div class="sh-sec"><h3>${t("cast")}</h3>${esc(x.cast.join(", "))}</div>` : ""}`;
}
function detLinks(m, x, dice = false){
  const link = m.imdb_id ? `https://www.imdb.com/title/${m.imdb_id}/` : null;
  return `
    <div class="sh-links">
      ${dice ? `<button class="again" type="button">${t("diceAgain")}</button>` : ""}
      ${x.yt ? `<a class="yt" href="https://www.youtube.com/watch?v=${esc(x.yt)}" target="_blank" rel="noopener">${t("trailer")}</a>` : ""}
      ${link ? `<a href="${link}" target="_blank" rel="noopener">IMDb</a>` : ""}
      <a href="https://www.themoviedb.org/${kind}/${m.id}" target="_blank" rel="noopener">TMDB</a>
    </div>`;
}
function renderSheet(x){
  const m = sheetM;
  $("#sheetBody").innerHTML = detHead(m) + detBody(m, x) + seasonsBlock(m) + detLinks(m, x, sheetDice);
  $(".sheet-x").title = t("close"); $(".sheet-x").setAttribute("aria-label", t("close"));
}
$(".sheet-bg").addEventListener("click", closeSheet);
$(".sheet-x").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#sheetBody").addEventListener("click", e => {
  if (e.target.closest(".again")) { rollDice(); return; }
  const btn = e.target.closest(".star, .rec, .seen"); if (btn && sheetM) toggleMark(String(sheetM.id), btn);
});
/* ✓ láttam / ☆ megnézem / ajánlom gomb az adatlapon (felugró vagy trend-panel):
   a listába ment, és mindenhol frissít, ahol a cím épp látszik */
function toggleMark(id, btn){
  const name = btn.classList.contains("star") ? "watch" : btn.classList.contains("rec") ? "recs" : "seen";
  const obj = L[kind][name];
  if (obj[id]) delete obj[id]; else obj[id] = today();
  saveList(kind, name);
  const m = cur().byId[id]; if (!m) return;
  const row = $(`#list .film[data-id="${id}"]`); if (row) row.outerHTML = card(m);
  if (sheetM && String(sheetM.id) === id) loadDetails(kind, id).then(renderSheet);
  if (trOpen && trOpen.id === id) refreshTr();
}

/* ===== 9c2. LENYÍLÓ ADATLAP A LISTÁBAN ====================================
   A sorra kattintva alatta lenyílik: történet, rendező, szereplők, linkek.
   Egyszerre csak egy lehet nyitva; újabb kattintásra becsukódik. */
function expHTML(m, x){ return detBody(m, x) + detLinks(m, x); }
function closeExp(){
  const row = listOpen && $(`#list .film[data-id="${listOpen}"]`);
  if (row) { row.classList.remove("open"); const n = row.nextElementSibling; if (n && n.classList.contains("exp")) n.remove(); }
  listOpen = null;
}
function toggleExp(row){
  const id = row.dataset.id, top = row.getBoundingClientRect().top, same = listOpen === id;
  closeExp();
  if (!same) {
    const m = cur().byId[id]; if (!m) return;
    listOpen = id; row.classList.add("open");
    row.insertAdjacentHTML("afterend", `<div class="exp" data-for="${id}">${expHTML(m, {loading: true})}</div>`);
    const k = kind;
    loadDetails(k, id).then(x => { const el = $(`#list .exp[data-for="${id}"]`); if (el && kind === k) el.innerHTML = expHTML(m, x); });
  }
  // ha fölötte egy másik adatlap csukódott be, a kattintott sor ne ugorjon el
  const d = row.getBoundingClientRect().top - top;
  if (d) window.scrollBy({top: d, behavior: "instant"});
}

/* ===== 9d. 🎲 VÉLETLEN AJÁNLÁS ===========================================
   A mostani szűrők eredményéből: elérhető, még nem látott, nem elrejtett.
   Ha van 70-es kombi fölötti, azok közül sorsol, különben bármelyikből. */
function rollDice(){
  const {seen, hidden} = L[kind];
  const pool = view.filter(m => m._on && !seen[m.id] && !hidden[m.id]);
  const good = pool.filter(m => (combo(m) ?? 0) >= 70);
  const from = good.length ? good : pool;
  if (!from.length) { alert(t("diceNone")); return; }
  let m = from[Math.floor(Math.random() * from.length)];
  if (from.length > 1 && sheetM && m === sheetM) m = from[(from.indexOf(m) + 1) % from.length];   // ne ugyanazt
  openSheet(m, true);
}
$("#dice").addEventListener("click", rollDice);

/* ===== 9e. IMPORT CSV-BŐL (IMDb / Letterboxd / Netflix) → "Láttam" =========
   IMDb:       "Const" oszlop (tt-azonosító) – filmek és sorozatok
   Letterboxd: "Name" + "Year" oszlop – filmek, cím és év alapján
   Netflix:    "Title" + "Date" oszlop – "Sorozat: Évad: Rész" → sorozat,
               különben film, cím alapján */
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function titleIndex(k){
  const idx = {};
  (D[k] ? D[k].all : []).forEach(m => [m.title, m.title_hu, m.orig].forEach(tl => { const n = norm(tl); if (n) (idx[n] = idx[n] || []).push(m); }));
  return idx;
}
$("#impCsv").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  await Promise.all(["movie", "tv"].map(k => loadKind(k).catch(() => null)));
  const rows = parseCSV((await f.text()).replace(/^﻿/, ""));
  if (rows.length < 2) { alert(t("impCsvBad")); return; }
  const head = rows[0].map(h => h.trim()), col = n => head.indexOf(n), data = rows.slice(1);
  const hit = {movie: new Set(), tv: new Set()}; let miss = 0;
  const mark = (k, m) => { if (m) hit[k].add(String(m.id)); return !!m; };
  if (col("Const") >= 0) {                               // IMDb
    const byImdb = {};
    ["movie", "tv"].forEach(k => (D[k] ? D[k].all : []).forEach(m => { if (m.imdb_id) byImdb[m.imdb_id] = [k, m]; }));
    data.forEach(r => { const x = byImdb[(r[col("Const")] || "").trim()]; if (!(x && mark(x[0], x[1]))) miss++; });
  } else if (col("Name") >= 0 && col("Year") >= 0) {      // Letterboxd
    const idx = titleIndex("movie");
    data.forEach(r => {
      const c = idx[norm(r[col("Name")])] || [], y = (r[col("Year")] || "").trim();
      if (!mark("movie", c.find(m => m.year === y) || (c.length === 1 ? c[0] : null))) miss++;
    });
  } else if (col("Title") >= 0) {                        // Netflix
    const tv = titleIndex("tv"), mv = titleIndex("movie");
    data.forEach(r => {
      const full = r[col("Title")] || "", first = full.split(": ")[0];
      if (full.includes(": ") && (tv[norm(first)] || []).length) mark("tv", tv[norm(first)][0]);
      else if ((mv[norm(full)] || []).length) mark("movie", mv[norm(full)][0]);
      else if ((tv[norm(full)] || []).length) mark("tv", tv[norm(full)][0]);
      else miss++;
    });
  } else { alert(t("impCsvBad")); return; }
  ["movie", "tv"].forEach(k => { hit[k].forEach(id => { if (!L[k].seen[id]) L[k].seen[id] = today(); }); saveList(k, "seen"); });
  apply();
  alert(t("impCsvOk")(hit.movie.size, hit.tv.size, miss));
});

/* ===== 10. ADATOK BETÖLTÉSE ==============================================
   Fajtánként csak az első megnyitáskor töltjük le a fájlt, utána a memóriából
   dolgozunk. A sorozatok fájlja az első v3-futásig még nem létezik. */
function loadKind(k){
  if (D[k]) return Promise.resolve(D[k]);
  return fetch(KINDS[k].file, {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(db => {
      const all = Object.values(db[KINDS[k].key] || db.movies || db.items || {});
      // régi (csak Netflix) adatforma átalakítása, ha még ilyen a fájl
      all.forEach(m => { for (const [c, a] of Object.entries(m.avail || {})) if ("on" in a || "first" in a) m.avail[c] = {netflix: a}; });
      return D[k] = {
        all, updated: db.updated || null, genres: db.genres || {}, since: db.since || {},
        services: db.services || {netflix: {name: "Netflix", logo: null}},
        initial: all.map(m => m.added || "").filter(Boolean).sort()[0] || "",
        years: [...new Set(all.map(m => m.year).filter(Boolean))].sort(),
        byId: Object.fromEntries(all.map(m => [String(m.id), m])),   // gyors keresés azonosító szerint
        trending: db.trending || [],                                  // heti trendlista (sorrend)
        det: {},                                                      // betöltött adatlap-fájlok
      };
    });
}
function showKind(){
  applyTexts();
  loadKind(kind).then(() => {
    applyTexts(); restoreFilters(); apply();
  }).catch(() => {
    applyTexts(); restoreFilters();
    $("#stats").textContent = ""; $("#resetAll").textContent = t("resetAll")(0);
    $("#list").innerHTML = `<p class="error">${t("error")}</p>`;
  });
}
// ajánlások a repóból (nem kötelező, a fájl hiányozhat)
fetch("data/ajanlasok.json", {cache: "no-cache"})
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d) { recsRemote = {movie: d.recs || {}, tv: d.recs_tv || {}}; apply(); } })
  .catch(() => {});
$("#stats").textContent = t("loading");
showKind();
// a másik fül adatait a háttérben előre betöltjük, így a váltás azonnali
setTimeout(() => loadKind(kind === "movie" ? "tv" : "movie").then(fillSvcBar).catch(() => {}), 1500);
</script>
