<!doctype html>
<!--
  STREAMING-KATALÓGUS DE/HU – a weboldal (v8: új design, nappali/éjszakai mód)
  ============================================================================
  Egyetlen fájl: HTML (szerkezet) + CSS (kinézet) + JavaScript (működés).
  Adatot nem gyűjt, csak beolvassa a data/movies.json és data/series.json
  fájlokat, amiket az update.py készít. A pipák és a szűrők a böngésződben
  tárolódnak. A betűtípus a fonts/ mappából jön (nem a Google-tól).
  Bővebb magyarázat: DOKUMENTACIO.md
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150F18" media="(prefers-color-scheme: dark)">
<title>Streaming-Katalog DE & HU</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎞️</text></svg>">
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  /* a mentett megjelenés (nappal/éjjel) már az első kirajzolás előtt érvényes, így nem villan */
  try { const th = JSON.parse(localStorage.getItem("theme")); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch(e) {}
</script>
<style>
/* ===== 1. BETŰTÍPUS ======================================================
   Bricolage Grotesque (SIL Open Font License, lásd fonts/OFL.txt), a saját
   repóból. Csak a címek és a számok használják; a szöveg a telefon saját betűje.
   Két kis fájl: alap latin betűk + a magyar ő/ű (csak ha kell, töltődik be). */
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage-latin.woff2") format("woff2");font-weight:500 800;font-display:swap;
  unicode-range:U+0020-007E,U+00A0-00FF,U+2013-2014,U+2018-201E,U+2022,U+2026,U+20AC,U+2191-2193,U+00D7}
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage-ext.woff2") format("woff2");font-weight:500 800;font-display:swap;
  unicode-range:U+0100-017F}

/* ===== 2. SZÍNEK – NAPPAL ÉS ÉJJEL =======================================
   A :root a "gyökér", itt vannak a változók (--bg = háttér, --ink = szöveg).
   Alapból a telefon beállítását követi (prefers-color-scheme); a fejlécben lévő
   kapcsolóval kézzel is választható: data-theme="light" vagy "dark".
   Nappal: világos, enyhén lilás papír. Éjjel: sötét „vetítőterem”.
   A borostyán kiemelés (--accent) mindkettőben ugyanaz. */
:root{
  --bg:#F5F3F6; --surface:#FFFFFF; --raised:#ECE7EE; --ink:#1C1520; --muted:#665B6A; --line:#DDD5E0;
  --accent:#E8A11A; --accent-ink:#231500; --hi:#F2B233; --hi-ink:#231500;
  --ok:#1E8A55; --no:#C23B30; --rec:#6A4BC4; --season:#17798A;
  --rank-fill:transparent; --rank-stroke:#1C1520;
  --scrim:rgba(28,21,32,.42); --lift:0 6px 18px rgba(28,21,32,.16);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:6px; --r-m:12px; --r-l:18px;
  --ease:cubic-bezier(.23,1,.32,1);   /* gyors indulás, lágy megállás */
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150F18; --surface:#1F1723; --raised:#2A202F; --ink:#F4ECE3; --muted:#A8999F; --line:#382C3D;
  --accent:#F4B942; --accent-ink:#221600; --hi:#F4B942; --hi-ink:#221600;
  --ok:#57C38C; --no:#F07F6E; --rec:#B79BFF; --season:#5CC6D6;
  --rank-fill:#F4B942; --rank-stroke:transparent;
  --scrim:rgba(0,0,0,.55); --lift:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150F18; --surface:#1F1723; --raised:#2A202F; --ink:#F4ECE3; --muted:#A8999F; --line:#382C3D;
  --accent:#F4B942; --accent-ink:#221600; --hi:#F4B942; --hi-ink:#221600;
  --ok:#57C38C; --no:#F07F6E; --rec:#B79BFF; --season:#5CC6D6;
  --rank-fill:#F4B942; --rank-stroke:transparent;
  --scrim:rgba(0,0,0,.55); --lift:0 8px 24px rgba(0,0,0,.45); color-scheme:dark}

/* ===== 3. ALAPOK ======================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;transition:background-color .3s var(--ease),color .3s var(--ease)}
img{max-width:100%}
button,select,input{font:inherit;color:inherit}
button,a,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
body[data-kind=tv] .only-movie, body[data-kind=movie] .only-tv{display:none!important}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== 4. FEJLÉC ======================================================== */
header{display:grid;gap:14px;padding-block:calc(18px + env(safe-area-inset-top,0px)) 4px}
.hrow{display:grid;gap:10px}
h1{font-family:var(--display);font-variation-settings:"opsz" 72;font-weight:800;font-size:clamp(2.1rem,9vw,3.1rem);line-height:.95;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0;max-width:34rem;text-wrap:pretty}
.hctl{display:flex;gap:6px;align-items:center;justify-self:end;order:-1}
.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.pill button{border:0;background:none;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.pill button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.theme{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:none;padding:4px 10px 4px 8px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:transform .16s var(--ease)}
.theme:active{transform:scale(.95)}
.theme svg{transition:transform .35s var(--ease)}
.theme.spin svg{transform:rotate(-90deg)}
@media (max-width:380px){.theme .tl{display:none}.theme{padding:5px 7px}}
.kinds{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.kinds button{border:0;background:none;padding:8px 0 10px;font-family:var(--display);font-size:19px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.kinds button[aria-pressed=true]{color:var(--ink)}
.kinds button[aria-pressed=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}

/* szolgáltató-sáv: 5 gomb egy sorban, logóval; a kikapcsolt szürke és halvány */
.svcrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px}
.svc{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:none;border-radius:var(--r-m);padding:8px 2px 6px;font-size:11.5px;line-height:1.15;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),transform .16s var(--ease)}
.svc:active{transform:scale(.96)}
.svc img{width:30px;height:30px;border-radius:7px;filter:grayscale(1);opacity:.4;transition:filter .2s var(--ease),opacity .2s var(--ease)}
.svc[aria-pressed=true]{background:var(--surface);border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.svc[aria-pressed=true] img{filter:none;opacity:1}

/* ===== 5. TREND-POLC (nagy helyezés-számok a plakátok mögött) =========== */
.shelf{padding-block:18px 4px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.shead h2{font-family:var(--display);font-size:20px;font-weight:800;margin:0}
.mini{display:inline-flex;background:var(--raised);border-radius:999px;padding:2px}
.mini button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.mini button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.trrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:4px 16px 8px;scroll-padding-left:16px;scrollbar-width:none}
.trrow::-webkit-scrollbar{display:none}
.trc{flex:0 0 auto;display:grid;grid-template-columns:auto 96px;align-items:end;scroll-snap-align:start;border:0;background:none;padding:0;cursor:pointer;text-align:left;transition:transform .16s var(--ease)}
.trc:active{transform:scale(.97)}
.rank{font-family:var(--display);font-variation-settings:"opsz" 96;font-weight:800;font-size:92px;line-height:.78;letter-spacing:.02em;margin-right:4px;color:var(--rank-fill);-webkit-text-stroke:2px var(--rank-stroke);font-variant-numeric:lining-nums}
.trc .tp{width:96px;aspect-ratio:2/3;height:auto;border-radius:var(--r-m);object-fit:cover;display:block;background:var(--raised);position:relative;box-shadow:var(--lift)}
.trc[aria-expanded=true] .tp{outline:3px solid var(--accent);outline-offset:3px}
.trdet{margin-top:8px;background:var(--surface);border-radius:var(--r-l);padding:16px;box-shadow:0 0 0 1px var(--line);display:grid;gap:10px;position:relative}

/* lenyíló rész: a magasság a rács-sor 0fr → 1fr átmenetével animálódik */
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s var(--ease)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden;min-height:0}

/* ===== 6. ESZKÖZSOR (keresés, szűrők, rendezés, kocka) – ragad a tetején = */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-top:10px}
.bar{display:grid;grid-template-columns:1fr auto auto auto;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-m);padding:0 12px;box-shadow:0 0 0 1px var(--line);min-width:0;color:var(--muted)}
.search input{border:0;background:none;font-size:16px;color:var(--ink);width:100%;min-width:0;padding:10px 0;outline:none}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:var(--r-m);padding:0 12px;height:44px;cursor:pointer;font-size:15px;font-weight:600;transition:transform .16s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.icon{width:44px;padding:0;justify-content:center}
.count{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.btn .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#openF{padding:0 10px}}
.achips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.achips::-webkit-scrollbar{display:none}
.achip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:4px 6px 4px 11px;font-size:13px;cursor:pointer;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.achip svg{opacity:.55}
.achip.bye{opacity:0;transform:scale(.9)}
.stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}

/* ===== 7. EGY SOR A LISTÁBAN (plakát | cím, elérhetőség, gombok | pontszám) */
.film{content-visibility:auto;contain-intrinsic-size:auto 200px;display:grid;grid-template-columns:60px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.film.open{border-bottom-color:transparent}
.pw{position:relative;display:block;width:60px;align-self:start}
.poster{width:60px;aspect-ratio:2/3;height:auto;border-radius:var(--r-s);background:var(--raised);object-fit:cover;display:block;transition:transform .16s var(--ease)}
.film:active .poster{transform:scale(.97)}
.tick{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;line-height:17px;text-align:center;border:2px solid var(--bg)}
.mid{min-width:0}
.ttl{display:block;font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;text-decoration:none;text-wrap:balance}
.meta{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.film.watched .ttl{color:var(--muted)}
.film.gone{opacity:.5}
.film.gone .poster{filter:grayscale(1)}
.film.hid{opacity:.45}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.b{font-size:12px;font-weight:700;border-radius:var(--r-s);padding:2px 7px}
.b.new{background:var(--hi);color:var(--hi-ink)}
.b.season{background:color-mix(in srgb,var(--season) 18%,transparent);color:var(--season)}
.b.rec{background:color-mix(in srgb,var(--rec) 18%,transparent);color:var(--rec)}
.avail{display:grid;gap:4px;margin-top:8px;font-size:13px}
.av{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.cc{font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--muted);width:22px}
.av img{width:20px;height:20px;border-radius:5px;display:block}
.av img.off{filter:grayscale(1);opacity:.35}
.av .svct{border-radius:var(--r-s);background:var(--raised);padding:1px 7px;font-size:12px;font-weight:600}
.av .svct.off{opacity:.45}
.av.off .until{color:var(--no);font-size:12px;font-weight:600}
.acts{display:flex;gap:4px;margin-top:8px;margin-left:-8px}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:transform .16s var(--ease),background-color .2s var(--ease),color .2s var(--ease)}
.ib:hover{background:var(--raised)}
.ib:active{transform:scale(.9)}
.ib.seen{--c:var(--ok)} .ib.star{--c:var(--accent)} .ib.rec{--c:var(--rec)}
.ib[aria-pressed=true]{color:var(--c)}
.ib[aria-pressed=true] svg{fill:color-mix(in srgb,var(--c) 24%,transparent)}
.ib.pop{animation:pop .28s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}
.score{display:grid;justify-items:end;align-content:start;gap:3px;text-align:right;font-variant-numeric:tabular-nums}
.src{font-size:11px;font-weight:700;color:var(--muted)}
.imdb{font-family:var(--display);font-variation-settings:"opsz" 96;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.imdb.hi{background:var(--hi);color:var(--hi-ink);border-radius:var(--r-s);padding:3px 7px 2px}
.film.gone .imdb.hi{background:none;color:inherit;padding:0}
.minor{font-size:13px;color:var(--muted);line-height:1.4}
.minor b{color:var(--ink);font-weight:700}
.hide{margin-top:6px;width:36px;height:36px;margin-right:-6px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:.65;transition:opacity .2s var(--ease),background-color .2s var(--ease)}
.hide:hover{opacity:1;background:var(--raised);color:var(--no)}
/* évadok a sorozatoknál */
details.seasons{margin-top:8px;font-size:13px}
details.seasons summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
details.seasons summary::-webkit-details-marker{display:none}
details.seasons summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s var(--ease)}
details.seasons[open] summary::after{transform:translateY(1px) rotate(-135deg)}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:6px 2px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.srow:last-child{border-bottom:0}
.srow b{font-weight:700}
.srow .sv{color:var(--muted)}

/* lenyíló adatlap a sor alatt */
.exp.open{border-bottom:1px solid var(--line)}
.expin{padding:0 0 16px 74px;display:grid;gap:10px;opacity:0;transform:translateY(-4px);transition:opacity .2s var(--ease) .04s,transform .2s var(--ease) .04s}
.exp.open .expin{opacity:1;transform:none}
@media (max-width:430px){.expin{padding-left:0}}

/* adatlap-részek (lista, trend, kocka) */
.sh-sec{font-size:15px;line-height:1.5}
.sh-sec h3{font-size:12px;font-weight:700;color:var(--muted);margin:0}
.sh-sec h3{display:flex;align-items:center;gap:8px;min-height:24px}
.ovsw{display:inline-flex;gap:3px}
.ovsw button{border:1px solid var(--line);background:none;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:background-color .18s var(--ease),color .18s var(--ease)}
.ovsw button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ovsw button:disabled{opacity:.35;cursor:default}
.sh-title{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
.trdet .sh-title{margin-right:40px}
.sh-top{display:grid;grid-template-columns:100px 1fr;gap:14px}
.sh-top>img,.sh-top>.tp{width:100px;aspect-ratio:2/3;height:auto;border-radius:var(--r-s);object-fit:cover;background:var(--raised)}
.sh-info{display:grid;gap:8px;align-content:start;min-width:0}
.scoreline{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.scoreline b{font-family:var(--display);font-size:22px;color:var(--ink)}
.scoreline b.hi{background:var(--hi);color:var(--hi-ink);border-radius:var(--r-s);padding:1px 7px}
.sh-links{display:flex;flex-wrap:wrap;gap:8px}
.sh-links a,.sh-links button{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:0;color:var(--ink);background:var(--raised);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .16s var(--ease)}
.sh-links a:active,.sh-links button:active{transform:scale(.97)}
.sh-links .yt{background:var(--ink);color:var(--bg)}
.sh-links .again{background:var(--accent);color:var(--accent-ink)}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--raised);cursor:pointer;display:grid;place-items:center;transition:transform .16s var(--ease)}
.x:active{transform:scale(.92)}

/* ===== 8. LAPOZÓ ========================================================= */
.pager{display:flex;justify-content:center;align-items:center;gap:14px;padding-block:14px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pager:empty{display:none}
.pager button{width:44px;height:40px;border-radius:var(--r-m);border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;font-size:18px;transition:transform .16s var(--ease)}
.pager button:active{transform:scale(.95)}
.pager button:disabled{opacity:.35;cursor:default}
.empty,.error{padding:40px 16px;text-align:center;color:var(--muted)}
#more{height:1px}

/* ===== 9. ALSÓ PANELEK (Szűrők, Rendezés, 🎲) ============================= */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .24s var(--ease);z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin:0 auto;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;max-height:88vh;display:grid;grid-template-rows:auto 1fr auto;transform:translateY(105%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s linear .3s;box-shadow:var(--lift)}
.bsheet.on{transform:none;visibility:visible;transition:transform .3s var(--ease)}
.shd{padding:10px 16px 8px;border-bottom:1px solid var(--line);position:relative}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.shd h2{font-family:var(--display);font-size:22px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.shd h2 small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted)}
.sbody{overflow:auto;padding:0 16px;overscroll-behavior:contain}
.dicebody{padding:16px;display:grid;gap:12px}
.grp{padding-block:14px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.grp:last-child{border-bottom:0}
.grp h3{font-size:14px;font-weight:700;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),transform .16s var(--ease)}
.opt:active{transform:scale(.97)}
.opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt img{width:18px;height:18px;border-radius:4px}
.tri[data-s="1"]{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok);color:var(--ok)}
.tri[data-s="1"]::before{content:"✓"}
.tri[data-s="2"]{background:color-mix(in srgb,var(--no) 14%,transparent);border-color:var(--no);color:var(--no)}
.tri[data-s="2"]::before{content:"✗"}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel{position:relative;display:block}
.sel select{appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-m);padding:10px 34px 10px 12px;font-size:16px;cursor:pointer}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sub2{font-size:12px;font-weight:700;color:var(--muted)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;cursor:pointer;padding-block:4px}
.sw input{appearance:none;-webkit-appearance:none;flex-shrink:0;width:44px;height:26px;border-radius:999px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);position:relative;cursor:pointer;transition:background-color .2s var(--ease);margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s var(--ease)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
details.more>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;padding-block:4px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s var(--ease)}
details.more[open]>summary::after{transform:rotate(-135deg)}
details.more .opts{margin-top:8px}
.radio{display:grid;gap:2px}
.radio button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:11px 4px;border-radius:var(--r-s);font-size:15px;text-align:left;cursor:pointer}
.radio button[aria-pressed=true]{font-weight:700}
.radio button[aria-pressed=true]::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.sfoot{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sfoot.one{grid-template-columns:1fr}
.primary{border:0;border-radius:var(--r-m);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;height:48px;cursor:pointer;transition:transform .16s var(--ease)}
.primary:active{transform:scale(.98)}
.ghost{border:0;background:none;color:var(--muted);font-weight:600;padding:0 8px;cursor:pointer}

/* ===== 10. LÁBLÉC ======================================================= */
footer{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:grid;gap:12px}
footer details.panel{background:var(--surface);border-radius:var(--r-m);box-shadow:0 0 0 1px var(--line);padding:10px 14px;font-size:14px;color:var(--ink)}
footer details.panel>summary{list-style:none;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center}
footer details.panel>summary::-webkit-details-marker{display:none}
footer details.panel>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s var(--ease)}
footer details.panel[open]>summary::after{transform:rotate(-135deg)}
.ftools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.ftools button,.ftools label{font-size:13px;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;cursor:pointer}
.plabel{font-size:13px;color:var(--muted)}
.tmdblogo{height:11px;width:auto;vertical-align:0;margin-right:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>

<div class="pager" id="pagerTop"></div>
<main id="list"></main>
<div id="more"></div>
<div class="pager" id="pagerBot"></div>

<div class="scrim" id="scrim"></div>

/* ===== 3. ÁLLAPOT ========================================================
   kind  = "movie" vagy "tv" – melyik fül van kiválasztva
   D     = a betöltött adatok fajtánként (csak az első megnyitáskor töltjük le)
   L     = a saját listáid fajtánként: seen (láttam), watch (megnézem),
           recs (ajánlom), hidden (elrejtett). A filmek a régi neveken maradnak,
           hogy a korábbi pipáid megmaradjanak; a sorozatok "tv_" előtagot kapnak.
   Minden a böngésző localStorage tárolójába mentődik. */
const KINDS = {
  movie: { file: "data/movies.json", key: "movies", pre: "" },
  tv:    { file: "data/series.json", key: "items",  pre: "tv_" },
};
const LIST_NAMES = ["seen", "watch", "recs", "hidden"];
let lang = load("lang", null) || (() => { try { return localStorage.getItem("lang") } catch(e){ return null } })()
  || ((navigator.language || "").toLowerCase().startsWith("hu") ? "hu" : "de");
if (lang !== "de" && lang !== "hu") lang = "de";
let kind = load("kind", "movie"); if (!KINDS[kind]) kind = "movie";
const D = {movie: null, tv: null};
const L = {};
for (const k in KINDS) { L[k] = {}; LIST_NAMES.forEach(n => L[k][n] = load(KINDS[k].pre + n)); }
const saveList = (k, n) => store(KINDS[k].pre + n, L[k][n]);
let recsRemote = {movie: {}, tv: {}};  // a repóban lévő ajanlasok.json – mindenki látja
let picks = load("picks"); picks.lang = picks.lang || {}; picks.country = picks.country || {};
let svcOn = load("svcOn");             // melyik szolgáltató van bekapcsolva (hiányzó = be)
let country = "ALL", view = [], shown = 0;
const PAGE = 60;                       // "Mind egyszerre" módban ennyi sor töltődik be görgetésenként
let pageSize = load("pageSize", "50");  // találat oldalanként (alap: 50), minden fülre közös
let page = 0, dir = "desc";             // aktuális oldal; rendezés iránya (fülenként mentve)
const IMG = "https://image.tmdb.org/t/p/w154", LOGO = "https://image.tmdb.org/t/p/w92";
const SVC_ORDER = ["netflix", "prime", "disney", "hbo", "apple"];

/* Szövegek: tk() a fülhöz illő változatot adja (pl. "Filme" vagy "Serien") */
const t = k => T[lang][k];
const tk = k => (kind === "tv" && T[lang][k + "_tv"] !== undefined) ? T[lang][k + "_tv"] : T[lang][k];
const nf = () => new Intl.NumberFormat(t("locale"));
const df = d => d ? new Date(d).toLocaleDateString(t("locale"), {day:"2-digit", month:"2-digit", year:"2-digit"}) : "";
const ttl = m => (lang === "hu" ? m.title_hu : m.title) || m.title || m.title_hu || m.orig || "";
const cur = () => D[kind];
const svcSel = k => svcOn[k] !== false;
const services = () => ({...(D.movie && D.movie.services), ...(D.tv && D.tv.services)});
const svcKeys = () => { const s = services(); return SVC_ORDER.filter(k => s[k]).concat(Object.keys(s).filter(k => !SVC_ORDER.includes(k))); };

   Ezek csak kirajzolnak, eseménykezelőt NEM regisztrálnak (az a 9. részben
   van, egyszer) – így nyelvváltáskor sem duplázódik semmi. */
/* Ikonok (kis SVG-rajzok a szövegbe ágyazva – nincs külön fájl, nincs letöltés) */

};
/* egy tizedesjegy a nyelv szerint: 8,1 */
const fmt1 = v => v == null ? "–" : v.toLocaleString(t("locale"), {minimumFractionDigits: 1, maximumFractionDigits: 1});
const genreNames = m => (m.genres || []).map(id => { const n = cur() && cur().genres[id]; return n ? (n[lang] || n.de) : null; }).filter(Boolean);

/* Megjelenés: auto (a telefon beállítása szerint) → nappal → éjjel */
const THEMES = ["auto", "light", "dark"];
let theme = load("theme", "auto"); if (!THEMES.includes(theme)) theme = "auto";
const THEME_META = [...document.querySelectorAll('meta[name="theme-color"]')].map(el => [el, el.content]);
function showTheme(){
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = theme;
  // a böngésző felső sávjának színe is igazodjon
  THEME_META.forEach(([el, orig]) => el.content = theme === "auto" ? orig : theme === "dark" ? "#150F18" : "#F5F3F6");
  const b = $("#theme");
  b.innerHTML = ICON[theme] + `<span class="tl">${t("th_" + theme)}</span>`;
  b.setAttribute("aria-label", t("themeT")(t("th_name")[theme])); b.title = b.getAttribute("aria-label");
}

function applyTexts(){
  document.documentElement.lang = lang;
  $$("[data-i]").forEach(el => el.textContent = tk(el.dataset.i));
  $$("[data-c]").forEach(el => el.textContent = t(el.dataset.c));
  $$("[data-i-ph]").forEach(el => { el.placeholder = t(el.dataset.iPh); el.setAttribute("aria-label", t(el.dataset.iPh)); });
  $$("#votes option").forEach(o => { if (+o.value) o.textContent = nf().format(+o.value); });
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $$(".kinds button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === kind));
  document.body.dataset.kind = kind;
  document.title = t("h1");
  $$("#pageSize option").forEach(o => o.textContent = o.value === "all" ? t("all") : o.value);
  $("#pageSize").value = pageSize;
  for (const [id, key] of [["#dice", "dice"], ["#openS", "sortOpen"], ["#openF", "filters"]]) { $(id).title = t(key); $(id).setAttribute("aria-label", t(key)); }
  $(".sheet-x").innerHTML = ICON.x; $(".sheet-x").setAttribute("aria-label", t("close"));
  showTheme(); showDir();
  fillSort(); fillYears(); fillGenres(); fillChips(); fillSvcBar(); renderTrends(); syncOpts();
}
function fillSort(){
  const sel = $("#sort"), val = sel.value;
  const opts = kind === "tv"
    ? [["combo", t("s_combo")], ["pop", t("s_pop")], ["imdb", "IMDb"], ["tmdb", "TMDB"], ["rt", "Rotten Tomatoes"], ["mc", "Metacritic"],
       ["newseason", t("s_newseason")], ["year", tk("s_year")], ["added", t("s_added")], ["gone", t("s_gone")], ["title", t("s_title")]]
    : [["combo", t("s_combo")], ["pop", t("s_pop")], ["imdb", "IMDb"], ["rt", "Rotten Tomatoes"], ["mc", "Metacritic"],
       ["year", tk("s_year")], ["added", t("s_added")], ["gone", t("s_gone")], ["title", t("s_title")]];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
  sel.value = opts.some(o => o[0] === val) ? val : "combo";
}
/* a rendezés-panel listája a (rejtett) #sort legördülőből */
function renderSortList(){
  const sel = $("#sort");
  $("#sortList").innerHTML = [...sel.options].map(o => `<button type="button" data-v="${o.value}" aria-pressed="${o.value === sel.value}">${esc(o.textContent)}</button>`).join("");
}
function fillYears(){
  const years = cur() ? cur().years : [];
  for (const [id, key] of [["#yFrom","yFrom"], ["#yTo","yTo"]]) {
    const sel = $(id), val = sel.value;
    const list = key === "yTo" ? [...years].reverse() : years;
    sel.innerHTML = `<option value="">${t(key)}: ${t("yAny")}</option>` + list.map(y => `<option value="${y}">${t(key)}: ${y}</option>`).join("");
    sel.value = val; sel.setAttribute("aria-label", t(key));
  }
}
function fillGenres(){
  const sel = $("#genre"), val = sel.value, g = cur() ? cur().genres : {};
  const list = Object.entries(g).map(([id, n]) => [id, n[lang] || n.de || id]).sort((a, b) => a[1].localeCompare(b[1], lang));
  sel.innerHTML = `<option value="">${t("g_any")}</option>` + list.map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join("");
  sel.value = val;
}
function fillSvcBar(){
  const s = services();
  $("#svcBar").innerHTML = svcKeys().map(k =>
    `<button class="svc" type="button" data-svc="${k}" aria-pressed="${svcSel(k)}">${s[k].logo ? `<img alt="" src="${LOGO}${s[k].logo}">` : ""}${esc(s[k].name || k)}</button>`).join("");
  $("#svcBar").setAttribute("aria-label", t("g_svc"));
}
/* A szűrőpanel gombsorai (.opts[data-sel]) a rejtett legördülőkből készülnek:
   ugyanazok az értékek, csak koppintható gombként. */
function syncOpts(){
  $$(".opts[data-sel]").forEach(box => {
    const sel = $("#" + box.dataset.sel);
    box.innerHTML = [...sel.options].map(o => `<button class="opt" type="button" data-v="${esc(o.value)}" aria-pressed="${o.value === sel.value}">${esc(o.textContent)}</button>`).join("");
  });
}

/* Nyelv/ország panel: minden tétel semleges → ✓ (csak ezek) → ✗ (kizárva) */
const dn = (type, code) => { try { return new Intl.DisplayNames([t("locale")], {type}).of(code) || code } catch(e){ return code } };
function chipList(key){
  const count = {};
  (cur() ? cur().all : []).forEach(m => { const v = m[key]; if (v) count[v] = (count[v] || 0) + 1; });
  return Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b));
}
function fillChips(){
  for (const [k, id] of [["lang", "#langChips"], ["country", "#countryChips"]]) {
    $(id).innerHTML = chipList(k).map(code => {
      const st = picks[k][code] || 0;
      const name = k === "lang" ? dn("language", code) : dn("region", code);
      return `<button class="opt tri" type="button" data-kind="${k}" data-code="${code}" data-s="${st}">${esc(name)}</button>`;
    }).join("");
  }
  const n = Object.values(picks.lang).filter(Boolean).length + Object.values(picks.country).filter(Boolean).length;
  $("#picksCount").textContent = n ? ` (${t("nActive")(n)})` : "";
}
function passPicks(m){
  for (const k of ["lang", "country"]) {
    const p = picks[k], v = m[k];
    const wanted = Object.keys(p).filter(c => p[c] === 1);
    if (v && p[v] === 2) return false;
    if (wanted.length && !(v && p[v] === 1)) return false;
  }
  return true;
}

/* ===== 5. SZŰRŐK MENTÉSE FÜLENKÉNT ======================================
   A filmek és a sorozatok szűrői külön mentődnek ("filters" és "tv_filters"). */
const CTRL = ["#sort","#votes","#seenFilter","#listFilter","#yFrom","#yTo","#genre","#runtime","#seasons","#status"];
const SWITCH = ["#onlyNew","#newSeason","#showGone","#showHidden"];
const DEFAULTS = {"#sort":"combo","#votes":"0","#seenFilter":"all","#listFilter":"all","#onlyNew":false,"#newSeason":false,"#showGone":true,"#showHidden":false};
function saveFilters(){
  const f = {country, dir};
  CTRL.forEach(id => f[id] = $(id).value);
  SWITCH.forEach(id => f[id] = $(id).checked);
  store(KINDS[kind].pre + "filters", f);
}
function restoreFilters(){
  const f = load(KINDS[kind].pre + "filters");
  country = f.country || "ALL"; $("#country").value = country;
  dir = f.dir === "asc" ? "asc" : "desc"; showDir();
  CTRL.forEach(id => { const v = f[id] ?? DEFAULTS[id] ?? ""; $(id).value = v; if ($(id).value !== v) $(id).value = DEFAULTS[id] ?? ""; });
  SWITCH.forEach(id => $(id).checked = f[id] ?? DEFAULTS[id]);
}
/* Az aktív szűrők listája: ebből lesznek a lista fölötti címkék (a ✕ törli őket)
   és a Szűrők gomb számlálója. Csak az aktuális fülön látható szűrők számítanak. */
function activeChips(){
  const out = [], optText = id => { const s = $(id), o = s.options[s.selectedIndex]; return o ? o.textContent : ""; };
  if (country !== "ALL") out.push({l: t({DE: "c_de", HU: "c_hu", BOTH: "c_both"}[country]), clear: () => { country = "ALL"; $("#country").value = "ALL"; }});
  if ($("#genre").value) out.push({l: optText("#genre"), clear: () => $("#genre").value = ""});
  const yf = $("#yFrom").value, yt = $("#yTo").value;
  if (yf || yt) out.push({l: yf && yt ? `${yf}–${yt}` : yf ? t("ySince")(yf) : t("yUntil")(yt), clear: () => { $("#yFrom").value = ""; $("#yTo").value = ""; }});
  (kind === "tv" ? ["#seasons", "#status"] : ["#runtime"]).forEach(id => { if ($(id).value) out.push({l: optText(id), clear: () => $(id).value = ""}); });
  if (+$("#votes").value) out.push({l: t("vN")(nf().format(+$("#votes").value)), clear: () => $("#votes").value = "0"});
  for (const k of ["lang", "country"]) for (const [code, st] of Object.entries(picks[k])) if (st)
    out.push({l: `${t(st === 1 ? "ch_only" : "ch_not")}: ${k === "lang" ? dn("language", code) : dn("region", code)}`, clear: () => { delete picks[k][code]; store("picks", picks); fillChips(); }});
  ["#seenFilter", "#listFilter"].forEach(id => { if ($(id).value !== "all") out.push({l: optText(id), clear: () => $(id).value = "all"}); });
  if ($("#onlyNew").checked) out.push({l: t("ch_new"), clear: () => $("#onlyNew").checked = false});
  if (kind === "tv" && $("#newSeason").checked) out.push({l: t("ch_season"), clear: () => $("#newSeason").checked = false});
  if (!$("#showGone").checked) out.push({l: t("ch_noGone"), clear: () => $("#showGone").checked = true});
  if ($("#showHidden").checked) out.push({l: tk("ch_hidden"), clear: () => $("#showHidden").checked = false});
  if (dir === "asc") out.push({l: t("ch_asc"), clear: () => { dir = "desc"; }});
  return out;
}
function resetAll(){
  country = "ALL"; $("#country").value = "ALL"; $("#q").value = "";
  dir = "desc"; showDir();
  CTRL.forEach(id => $(id).value = DEFAULTS[id] ?? "");
  SWITCH.forEach(id => $(id).checked = DEFAULTS[id]);
  picks = {lang: {}, country: {}}; store("picks", picks); fillChips();
  // a szolgáltatók (fenti sáv = előfizetéseid) maradnak, azokat a „Mind törlése” nem bántja
  saveFilters(); apply();
}

/* ===== 6. ELÉRHETŐSÉG, ÚJDONSÁG, PONTSZÁM ===============================
   avail szerkezete: { "DE": { "netflix": {first, on, last, gone}, ... }, "HU": {...} }
   onIn   = egy bekapcsolt szolgáltatónál MOST elérhető az adott országban
   everIn = egy bekapcsolt szolgáltatónál valaha elérhető volt ott */
const onIn = (m, c) => Object.entries(m.avail[c] || {}).some(([k, a]) => svcSel(k) && a.on);
const everIn = (m, c) => Object.keys(m.avail[c] || {}).some(svcSel);
function isAvailable(m){
  if (country === "DE" || country === "HU") return onIn(m, country);
  if (country === "BOTH") return onIn(m, "DE") && onIn(m, "HU");
  return onIn(m, "DE") || onIn(m, "HU");
}
function inScope(m){
  if (country === "DE" || country === "HU") return everIn(m, country);
  if (country === "BOTH") return everIn(m, "DE") && everIn(m, "HU");
  return everIn(m, "DE") || everIn(m, "HU");
}
const lastGone = m => Object.values(m.avail).flatMap(r => Object.values(r)).map(a => a.gone || "").sort().pop() || "";
/* "ÚJ": egy bekapcsolt szolgáltatónál az elmúlt 7 napban jelent meg. A szolgáltató
   első figyelési napja (since) nem számít, különben minden újnak látszana. */
function isNew(m){
  const d = cur(), week = daysAgo(7);
  const cs = (country === "DE" || country === "HU") ? [country] : Object.keys(m.avail);
  return cs.some(c => Object.entries(m.avail[c] || {}).some(([k, a]) =>
    svcSel(k) && a.on && a.first && a.first >= week && a.first > (d.since[`${c}:${k}`] || d.initial)));
}
/* legutóbbi, már megjelent évad (a jövőbeli bejelentett évadot nem számoljuk) */
function lastSeason(m){
  const now = today();
  return (m.seasons || []).filter(s => s.date && s.date <= now).sort((a, b) => b.n - a.n)[0] || null;
}
/* "ÚJ ÉVAD": a legutóbbi évad (2. vagy későbbi) az elmúlt 6 hónapban jelent meg */
function isNewSeason(m){ const s = lastSeason(m); return !!s && s.n > 1 && s.date >= daysAgo(183); }
/* Kombi-pontszám 0–100: IMDb ×10, (sorozatnál TMDB ×10, ha legalább 20 szavazat), RT, MC átlaga */
function combo(m){
  const r = m.r || {}, v = [];
  if (r.imdb != null) v.push(r.imdb * 10);
  if (kind === "tv" && m.tmdb && (m.tmdb_n || 0) >= 20) v.push(m.tmdb * 10);
  if (r.rt != null) v.push(r.rt);
  if (r.mc != null) v.push(r.mc);
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}
const tmdbScore = m => (m.tmdb && (m.tmdb_n || 0) >= 20) ? m.tmdb : null;

/* ===== 7. SZŰRÉS ÉS RENDEZÉS =============================================
   filter = kidobja, ami nem felel meg | sort = sorrendbe rakja */
function apply(){
  const d = cur(); if (!d) return;
  const {seen, watch, recs, hidden} = L[kind], rRemote = recsRemote[kind];
  const q = $("#q").value.trim().toLowerCase(), sort = $("#sort").value;
  const minVotes = +$("#votes").value, showGone = $("#showGone").checked;
  const yf = $("#yFrom").value, yt = $("#yTo").value, g = $("#genre").value;
  const lf = $("#listFilter").value, sf = $("#seenFilter").value;
  const rtv = $("#runtime").value, sev = $("#seasons").value, stv = $("#status").value;
  const showHidden = $("#showHidden").checked;
  const onlyNew = $("#onlyNew").checked, newSeason = kind === "tv" && $("#newSeason").checked;

  view = d.all.filter(m => {
    if (!inScope(m)) return false;
    m._on = isAvailable(m);
    if (!showGone && !m._on) return false;
    if ((yf || yt) && !m.year) return false;
    if (yf && m.year < yf) return false;
    if (yt && m.year > yt) return false;
    if (!passPicks(m)) return false;
    if (g && !(m.genres || []).includes(+g)) return false;
    if (kind === "movie" && rtv) { const [lo, hi] = rtv.split("-").map(Number); if (!m.runtime || m.runtime <= lo || m.runtime > hi) return false; }
    if (kind === "tv" && sev) { const [lo, hi] = sev.split("-").map(Number); if (!m.n_s || m.n_s < lo || m.n_s > hi) return false; }
    if (kind === "tv" && stv && m.status !== stv) return false;
    if (onlyNew && !isNew(m)) return false;
    if (newSeason && !isNewSeason(m)) return false;
    if (hidden[m.id] && !showHidden) return false;   // elrejtés: csak a kapcsolóval látszik
    if (lf === "watch" && !watch[m.id]) return false;
    if (lf === "rec" && !(recs[m.id] || rRemote[m.id])) return false;
    if (sf === "yes" && !seen[m.id]) return false;
    if (sf === "no" && seen[m.id]) return false;
    if (minVotes && ((m.r && m.r.votes) || 0) < minVotes) return false;
    if (q && !`${m.title || ""} ${m.title_hu || ""} ${m.orig || ""}`.toLowerCase().includes(q)) return false;
    return true;
  });

  const r = (m, k) => m.r ? num(m.r[k]) : -Infinity;
  const ls = m => (lastSeason(m) || {}).date || "";
  const cmp = {
    combo: (a, b) => num(combo(b)) - num(combo(a)) || r(b, "votes") - r(a, "votes"),
    imdb:  (a, b) => r(b, "imdb") - r(a, "imdb") || r(b, "votes") - r(a, "votes"),
    tmdb:  (a, b) => num(tmdbScore(b)) - num(tmdbScore(a)) || (b.tmdb_n || 0) - (a.tmdb_n || 0),
    pop:   (a, b) => (b.pop || 0) - (a.pop || 0),
    rt:    (a, b) => r(b, "rt") - r(a, "rt") || r(b, "imdb") - r(a, "imdb"),
    mc:    (a, b) => r(b, "mc") - r(a, "mc") || r(b, "imdb") - r(a, "imdb"),
    newseason: (a, b) => ls(b).localeCompare(ls(a)),
    year:  (a, b) => (b.year || "").localeCompare(a.year || ""),
    added: (a, b) => (b.added || "").localeCompare(a.added || ""),
    gone:  (a, b) => lastGone(b).localeCompare(lastGone(a)),
    title: (a, b) => ttl(a).localeCompare(ttl(b), lang),
  }[sort] || (() => 0);
  // az elérhetők előre, kivéve a "Nemrég eltávolítva" rendezésnél
  // "↑" (növekvő) a rendezést fordítja meg; az elérhetők így is elöl maradnak
  // ami nem rendelkezik az adott értékkel (pl. nincs pontszám), mindig a végére kerül
  const val = {combo, imdb: m => m.r && m.r.imdb, tmdb: tmdbScore, rt: m => m.r && m.r.rt, mc: m => m.r && m.r.mc,
               pop: m => m.pop || null, newseason: m => ls(m) || null, year: m => m.year, added: m => m.added, gone: m => lastGone(m) || null}[sort];
  const miss = m => val ? val(m) == null : false;
  const c = (a, b) => (miss(a) - miss(b)) || (dir === "asc" ? cmp(b, a) : cmp(a, b));
  view.sort((a, b) => (sort !== "gone" && (b._on - a._on)) || c(a, b));

  updateStats();
  page = 0; render();
}
/* ===== 7b. MEGJELENÍTÉS OLDALANKÉNT ======================================
   pageSize = 10/25/50/100 → egyszerre egy oldal, lapozóval
   pageSize = "all"        → minden, görgetésre töltődik (a telefon miatt adagokban) */
let listOpen = null;   // a listában épp lenyitott cím azonosítója (szövegként)
let trOpen = null;     // a trendsor alatt nyitott cím: {k: fajta, id}
function render(){
  shown = 0; listOpen = null;   // újrarajzoláskor a lenyitott adatlap becsukódik
  $("#list").innerHTML = view.length ? "" : `<p class="empty">${t("empty")}</p>`;
  if (pageSize === "all") { $("#pagerTop").innerHTML = $("#pagerBot").innerHTML = ""; renderMore(); return; }
  const size = +pageSize, pages = Math.max(1, Math.ceil(view.length / size));
  page = Math.min(page, pages - 1);
  $("#list").insertAdjacentHTML("beforeend", view.slice(page * size, (page + 1) * size).map(card).join(""));
  shown = view.length;   // a görgetéses betöltés ilyenkor ne tegyen hozzá semmit
  const html = pages > 1
    ? `<button data-p="-1" aria-label="${t("prev")}" ${page === 0 ? "disabled" : ""}>‹</button><span>${t("pageOf")(page + 1, pages)}</span><button data-p="1" aria-label="${t("next")}" ${page >= pages - 1 ? "disabled" : ""}>›</button>`
    : "";
  $("#pagerTop").innerHTML = $("#pagerBot").innerHTML = html;
}
function showDir(){
  $$("#dirChips .opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.d === dir));
}
let ACT = [];   // az éppen kirajzolt aktív-szűrő címkék
function updateStats(){
  const d = cur();
  syncOpts(); showDir(); renderSortList();
  ACT = activeChips();
  $("#actChips").innerHTML = ACT.map((c, i) => `<button class="achip" type="button" data-n="${i}" aria-label="${esc(t("chipDel")(c.l))}">${esc(c.l)}${ICON.x}</button>`).join("");
  $("#actChips").hidden = !ACT.length;
  $("#fCount").textContent = ACT.length; $("#fCount").hidden = !ACT.length;
  $("#fAct").textContent = ACT.length ? t("nActive")(ACT.length) : "";
  if (!d) return;
  const avail = view.filter(m => m._on).length, so = $("#sort");
  $("#stats").textContent = tk("stats")(nf().format(view.length), nf().format(avail)) + " "
    + t("sortBy")(so.options[so.selectedIndex] ? so.options[so.selectedIndex].textContent : "")
    + (d.updated ? t("stand")(new Date(d.updated).toLocaleString(t("locale"), {dateStyle: "short", timeStyle: "short"})) : "");
  $("#applyF").textContent = tk("showN")(nf().format(view.length));
}

/* ===== 8. EGY SOR KIRAJZOLÁSA ============================================
   Szövegből épít HTML-t. Az esc() védi az oldalt a különleges karakterektől. */
/* egy ország sora: "DE" + a szolgáltatók logói; a már nem elérhető halvány, mellette a dátum */
function flag(m, c){
  const reg = m.avail[c]; if (!reg) return "";
  const s = services();
  const list = Object.entries(reg).sort((x, y) => SVC_ORDER.indexOf(x[0]) - SVC_ORDER.indexOf(y[0]));
  const logos = list.map(([k, a]) => {
    const sv = s[k] || {name: k};
    const tip = `${sv.name || k}: ${a.on ? t("since")(df(a.first)) : t("removed")(df(a.gone))}`;
    return sv.logo
      ? `<img class="${a.on ? "" : "off"}" alt="${esc(sv.name || k)}" title="${esc(tip)}" src="${LOGO}${sv.logo}">`
      : `<span class="svct${a.on ? "" : " off"}" title="${esc(tip)}">${esc(sv.name || k)}</span>`;
  }).join("");
  if (list.some(([, a]) => a.on)) return `<div class="av"><span class="cc">${c}</span>${logos}</div>`;
  const gone = list.map(([, a]) => a.gone || "").sort().pop();
  return `<div class="av off"><span class="cc">${c}</span>${logos}<span class="until">${t("until")(df(gone))}</span></div>`;
}
/* a három ikon-gomb: láttam / megnézem / ajánlom */
function acts(m){
  const {seen, watch, recs} = L[kind], w = !!seen[m.id], wl = !!watch[m.id], rc = !!recs[m.id];
  const b = (cls, on, key, ic) => `<button class="ib ${cls}" type="button" aria-pressed="${on}" aria-label="${t(key)}" title="${t(key)}">${ICON[ic]}</button>`;
  return `<div class="acts">${b("seen", w, "seen", "seen")}${b("star", wl, "watch", "watch")}${b("rec", rc, "rec", "rec")}</div>`;
}
function meta(m){
  const orig = m.orig && m.orig !== ttl(m) ? `, ${esc(m.orig)}` : "";
  if (kind === "movie") return `${esc(m.year || "")}${m.runtime ? `, ${m.runtime} ${t("min")}` : ""}${orig}`;
  const years = m.year ? (m.status === "end" ? (m.end && m.end !== m.year ? `${m.year}–${m.end}` : m.year) : `${m.year}– (${t("running")})`) : "";
  return [years, m.n_s ? t("seasonsN")(m.n_s) : "", m.n_e ? t("episodes")(m.n_e) : ""].filter(Boolean).join(", ") + orig;
}
/* évadok lenyitható listája: "2. évad · 2021 · 8 rész · TMDB 8.1" */
function seasonsBlock(m){
  if (kind !== "tv" || !(m.seasons || []).length) return "";
  const rows = [...m.seasons].sort((a, b) => a.n - b.n).map(s =>
    `<div class="srow"><b>${t("seasonRow")(s.n)}</b><span>${s.date ? s.date.slice(0, 4) : "–"}${s.ep ? ` · ${t("episodes")(s.ep)}` : ""}</span><span class="sv">${s.vote ? `TMDB ${s.vote.toFixed(1)}` : "–"}</span></div>`).join("");
  return `<details class="seasons"><summary>${t("seasonsN")(m.seasons.length)}</summary>${rows}</details>`;
}
function card(m){
  const {seen, recs, hidden} = L[kind];
  const r = m.r || {}, id = String(m.id), open = listOpen === id;
  const link = m.imdb_id ? `https://www.imdb.com/title/${m.imdb_id}/` : `https://www.themoviedb.org/${kind}/${m.id}`;
  const w = !!seen[m.id], rc = !!(recs[m.id] || recsRemote[kind][m.id]), hd = !!hidden[m.id];
  const ts = kind === "tv" ? tmdbScore(m) : null, g = genreNames(m).slice(0, 2).join(", ");
  const badges = [isNew(m) && `<span class="b new">${t("newBadge")}</span>`,
                  kind === "tv" && isNewSeason(m) && `<span class="b season">${t("newSeasonBadge")}</span>`,
                  rc && `<span class="b rec">${t("recBadge")}</span>`].filter(Boolean).join("");
  return `<div class="film${m._on ? "" : " gone"}${w ? " watched" : ""}${hd ? " hid" : ""}${open ? " open" : ""}" data-id="${m.id}">
    <a class="pw" href="${link}" target="_blank" rel="noopener" data-open="${m.id}" tabindex="-1" aria-hidden="true">${m.poster ? `<img class="poster" loading="lazy" alt="" src="${IMG}${m.poster}">` : `<div class="poster"></div>`}${w ? `<span class="tick">✓</span>` : ""}</a>
    <div class="mid">
      <a class="ttl" href="${link}" target="_blank" rel="noopener" data-open="${m.id}" aria-expanded="${open}">${esc(ttl(m))}</a>
      <div class="meta">${meta(m)}${g ? `<br>${esc(g)}` : ""}</div>
      ${badges ? `<div class="badges">${badges}</div>` : ""}
      <div class="avail">${flag(m, "DE")}${flag(m, "HU")}</div>
      ${acts(m)}
      ${seasonsBlock(m)}
    </div>
    <div class="score">
      <span class="src">IMDb</span>
      <span class="imdb${r.imdb >= 7.5 ? " hi" : ""}">${fmt1(r.imdb)}</span>
      <span class="minor">Ø <b>${combo(m) ?? "–"}</b>${kind === "tv" ? `<br>TMDB ${fmt1(ts)}` : ""}<br>RT ${r.rt != null ? r.rt + "%" : "–"}<br>MC ${r.mc ?? "–"}</span>
      <button class="hide" type="button" title="${hd ? t("unhideT") : t("hideT")}" aria-label="${hd ? t("unhideT") : t("hideT")}">${hd ? ICON.undo : ICON.x}</button>
    </div>
  </div>`;
}
/* Fokozatos betöltés: egyszerre csak 60 sort rajzolunk ki. Ha az oldal aljára
   érsz (IntersectionObserver figyeli), jön a következő adag. */
function renderMore(){
  const chunk = view.slice(shown, shown + PAGE);
  $("#list").insertAdjacentHTML("beforeend", chunk.map(card).join(""));
  shown += chunk.length;
}
new IntersectionObserver(e => { if (e[0].isIntersecting && shown < view.length) renderMore(); }, {rootMargin: "800px"}).observe($("#more"));

$("#picksGrp").addEventListener("click", e => {
  const c = e.target.closest(".tri[data-kind]"); if (!c) return;
  const {kind: k, code} = c.dataset;
  picks[k][code] = ((picks[k][code] || 0) + 1) % 3;
  if (!picks[k][code]) delete picks[k][code];
  store("picks", picks); fillChips(); apply();
});
$("#resetPicks").addEventListener("click", () => { picks = {lang: {}, country: {}}; store("picks", picks); fillChips(); apply(); });
// gombok a sorokban: ✕ elrejtés, ⭐ megnézem, 🍽 ajánlom, ✓ láttam
$("#list").addEventListener("click", e => {
  if (e.target.closest(".exp")) return;                        // a lenyílt részben csak a linkek működnek
  const op = e.target.closest("[data-open]");
  if (op && (e.ctrlKey || e.metaKey)) return;                  // Ctrl/Cmd + kattintás: IMDb új lapon
  const btn = e.target.closest("button.hide, button.star, button.rec, button.seen");
  if (!btn) {
    // bárhol a sorra kattintva lenyílik / becsukódik az adatlap
    // (kivéve az évadlistát és az egyéb gombokat/linkeket)
    if (e.target.closest("details, button, a:not([data-open])")) return;
    const r = e.target.closest(".film"); if (!r) return;
    e.preventDefault(); toggleExp(r); return;
  }
  const row = btn.closest(".film"), id = row.dataset.id;
  const name = btn.classList.contains("hide") ? "hidden" : btn.classList.contains("star") ? "watch"
             : btn.classList.contains("rec") ? "recs" : "seen";
  const obj = L[kind][name];
  if (obj[id]) delete obj[id]; else obj[id] = today();
  saveList(kind, name);
  if (name === "hidden" && !$("#showHidden").checked) {
    // a sor kikerül az aktuális nézetből; nem rajzoljuk újra az egészet,
    // így a lista nem ugrik vissza a tetejére (ha az elrejtettek látszanak,
    // a sor marad, csak halványabb lesz – lent újrarajzoljuk)
    view = view.filter(m => String(m.id) !== id); shown = Math.max(0, shown - 1);
    if (listOpen === id) closeExp();
    row.remove(); updateStats();
    if (!view.length) $("#list").innerHTML = `<p class="empty">${t("empty")}</p>`;
    return;
  }
  const m = cur().byId[id];
  if (m) { row.outerHTML = card(m); popBtn(`#list .film[data-id="${id}"]`, name); }   // csak ezt az egy sort rajzoljuk újra
  if (trOpen && trOpen.id === id) refreshTr();                 // a trend-adatlap gombjai is frissülnek
});
/* bekapcsoláskor a gomb egy kicsit „megpattan” */
function popBtn(scope, name){
  const cls = {seen: "seen", watch: "star", recs: "rec"}[name]; if (!cls) return;
  const b = $(`${scope} button.ib.${cls}`);
  if (b && b.getAttribute("aria-pressed") === "true") b.classList.add("pop");
}
// listák mentése fájlba: filmek a gyökérben (régi formátum), sorozatok a "tv" alatt
$("#exp").addEventListener("click", () => {
  const out = {...L.movie, tv: L.tv};
  download(`listak-${today()}.json`, out);
});
$("#expRec").addEventListener("click", () => {
  download("ajanlasok.json", {recs: L.movie.recs, recs_tv: L.tv.recs});
  alert(t("recHint"));
});
$("#imp").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    let n = 0;
    for (const [k, src] of [["movie", d], ["tv", d.tv || {}]]) {
      LIST_NAMES.forEach(name => { const add = src[name] || {}; n += Object.keys(add).length; Object.assign(L[k][name], add); saveList(k, name); });
    }
    apply(); alert(t("impOk")(n));
  } catch(err) { alert(t("impErr")); }
  e.target.value = "";
});
function download(name, obj){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], {type: "application/json"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ===== 9b. TREND-POLC =====================================================
   A heti trendlista sorrendjében azok a címek, amik a kiválasztott országban
   most elérhetők egy BEKAPCSOLT szolgáltatódnál (a fenti sáv szerint). A többi
   szűrő, a látott és az elrejtett címek nem hatnak rá. Nagy szám = helyezés; koppintásra alatta nyílik le
   az adatlap (plakát nélkül, mert az fölötte már látszik). */
let trC = load("trC", null) || (lang === "hu" ? "HU" : "DE");
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function renderTrends(){
  const d = cur(), box = $("#trends");
  $$(".trsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tc === trC));
  if (!d) { box.hidden = true; return; }
  const list = d.trending.map(id => d.byId[id])
    .filter(m => m && Object.entries(m.avail[trC] || {}).some(([k, a]) => svcSel(k) && a.on)).slice(0, 20);
  box.hidden = !list.length;
  // a nyitott trend-adatlap marad, ha a cím még a sorban van; különben becsukódik
  if (trOpen && (trOpen.k !== kind || !list.some(m => String(m.id) === trOpen.id))) closeTr();
  $("#trRow").innerHTML = list.map((m, i) => `<button class="trc" type="button" data-open="${m.id}" aria-expanded="false" aria-label="${i + 1}. ${esc(ttl(m))}">
      <span class="rank" aria-hidden="true">${i + 1}</span>${m.poster ? `<img class="tp" loading="lazy" alt="" src="https://image.tmdb.org/t/p/w185${m.poster}">` : `<div class="tp"></div>`}</button>`).join("");
  markTr(); if (trOpen) refreshTr();   // nyelvváltáskor a nyitott adatlap is átvált
}
$$(".trsw button").forEach(b => b.addEventListener("click", () => { trC = b.dataset.tc; store("trC", trC); renderTrends(); }));
$("#trRow").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openTr(b.dataset.open); });
$("#trDet").addEventListener("click", e => {
  if (e.target.closest(".x")) { closeTr(); return; }
  const btn = e.target.closest("button.ib"); if (btn && trOpen) toggleMark(trOpen.id, btn);
});
function openTr(id){
  if (trOpen && trOpen.k === kind && trOpen.id === id) { closeTr(); return; }
  if (!cur().byId[id]) return;
  trOpen = {k: kind, id};
  markTr(); $("#trDet").innerHTML = ""; refreshTr();
  $("#trFold").classList.add("open");
  setTimeout(() => { if (trOpen) $("#trFold").scrollIntoView({block: "nearest", behavior: reduced() ? "auto" : "smooth"}); }, 280);
}
function refreshTr(){
  const m = cur() && cur().byId[trOpen.id]; if (!m) { closeTr(); return Promise.resolve(); }
  m._on = isAvailable(m);
  const draw = x => $("#trDet").innerHTML =
    `<button class="x" type="button" title="${t("close")}" aria-label="${t("close")}">${ICON.x}</button>`
    + detHead(m, false) + detBody(m, x) + seasonsBlock(m) + detLinks(m, x);
  if (!$("#trDet").innerHTML) draw({loading: true});
  const {k, id} = trOpen;
  return loadDetails(k, id).then(x => { if (trOpen && trOpen.id === id && kind === k) draw(x); });
}
function closeTr(){
  trOpen = null; $("#trFold").classList.remove("open"); markTr();
  setTimeout(() => { if (!trOpen) $("#trDet").innerHTML = ""; }, 300);   // a csukódás után ürül ki
}
function markTr(){ $$("#trRow .trc").forEach(b => b.setAttribute("aria-expanded", !!trOpen && b.dataset.open === trOpen.id)); }

/* ===== 9c. ADATLAP ========================================================
   Az adatlapok 100 kis fájlban vannak (data/details/<fajta>/00.json … 99.json,
   az azonosító utolsó két számjegye szerint). Csak a kellő fájlt töltjük le. */
function loadDetails(k, id){
  const n = String(+id % 100).padStart(2, "0"), d = D[k];
  if (!d.det[n]) d.det[n] = fetch(`data/details/${k}/${n}.json`, {cache: "no-cache"}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  return d.det[n].then(sh => sh[String(id)] || {});
}

/* Alsó panelek (Szűrők, Rendezés, 🎲): alulról felcsúsznak, mögöttük elsötétül az oldal.
   Egyszerre csak egy lehet nyitva; bezáráskor a fókusz visszakerül oda, ahonnan jött. */
let openPanel = null, lastFocus = null;
function showSheet(el){
  if (openPanel && openPanel !== el) openPanel.classList.remove("on");
  if (!openPanel) lastFocus = document.activeElement;
  openPanel = el; el.classList.add("on"); $("#scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  el.setAttribute("tabindex", "-1"); el.focus({preventScroll: true});
}
function hideSheet(){
  if (!openPanel) return;
  if (openPanel.id === "sheet") sheetM = null;
  openPanel.classList.remove("on"); $("#scrim").classList.remove("on");
  document.body.style.overflow = ""; openPanel = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll: true});
}
document.addEventListener("keydown", e => { if (e.key === "Escape") hideSheet(); });

/* 🎲 felugró panel */
let sheetM = null, sheetDice = false;
function openSheet(m, fromDice = false){
  if (!m) return;
  sheetM = m; sheetDice = fromDice;
  m._on = isAvailable(m);
  renderSheet({loading: true});
  showSheet($("#sheet"));
  const k = kind;
  loadDetails(k, m.id).then(x => { if (sheetM === m && kind === k) renderSheet(x); });
}
/* Az adatlap részei – a lista lenyíló része, a trend-panel és a 🎲 ugyanezekből épül:
   detHead = (plakát), cím, adatok, pontszámok, elérhetőség, a 3 ikon-gomb
   detBody = történet, rendező/alkotó, szereplők
   detLinks = előzetes, IMDb, TMDB (+ a kockánál „Másikat”) */
function detHead(m, poster = true){
  const r = m.r || {}, ts = kind === "tv" ? tmdbScore(m) : null, g = genreNames(m);
  const info = `<div class="sh-info">
      <h2 class="sh-title">${esc(ttl(m))}</h2>
      <div class="meta">${meta(m)}${g.length ? `<br>${esc(g.join(", "))}` : ""}</div>
      <div class="scoreline"><span>IMDb <b class="${r.imdb >= 7.5 ? "hi" : ""}">${fmt1(r.imdb)}</b></span><span>Ø <b>${combo(m) ?? "–"}</b></span>${kind === "tv" ? `<span>TMDB ${fmt1(ts)}</span>` : ""}<span>RT ${r.rt != null ? r.rt + "%" : "–"}</span><span>MC ${r.mc ?? "–"}</span></div>
      <div class="avail">${flag(m, "DE")}${flag(m, "HU")}</div>
      ${acts(m)}
    </div>`;
  if (!poster) return info;
  return `<div class="sh-top" data-id="${m.id}">${m.poster ? `<img alt="" src="https://image.tmdb.org/t/p/w342${m.poster}">` : `<div class="tp"></div>`}${info}</div>`;
}
/* Történet: HU / DE / EN kapcsolóval. Sorrend: amit kézzel választottál (ha van
   ilyen nyelvű leírás), különben az oldal nyelve → angol → a harmadik nyelv.
   A kézi választást a böngésző megjegyzi ("ovLang"). */
let ovPref = load("ovLang", null);
function detBody(m, x){
  let head = t("overview"), text = t("loadingDet");
  if (!x.loading) {
    const have = {hu: x.ov_hu, de: x.ov_de, en: x.ov_en};
    const order = [ovPref, lang, "en", lang === "hu" ? "de" : "hu"];
    const pick = order.find(c => c && have[c]);
    text = pick ? have[pick] : t("noOverview");
    if (pick) head += `<span class="ovsw" role="group" aria-label="${t("ovLangT")}">` + ["hu", "de", "en"].map(c =>
      `<button type="button" data-ol="${c}" aria-pressed="${c === pick}" title="${esc(dn("language", c))}"${have[c] ? "" : " disabled"}>${c.toUpperCase()}</button>`).join("") + `</span>`;
  }
  return `
    <div class="sh-sec"><h3>${head}</h3>${esc(text)}</div>
    ${x.crew && x.crew.length ? `<div class="sh-sec"><h3>${t(kind === "tv" ? "creator" : "director")}</h3>${esc(x.crew.join(", "))}</div>` : ""}
    ${x.cast && x.cast.length ? `<div class="sh-sec"><h3>${t("cast")}</h3>${esc(x.cast.join(", "))}</div>` : ""}`;
}
function detLinks(m, x, dice = false){
  const link = m.imdb_id ? `https://www.imdb.com/title/${m.imdb_id}/` : null;
  return `
    <div class="sh-links">
      ${dice ? `<button class="again" type="button">${ICON.dice}${t("diceAgain")}</button>` : ""}
      ${x.yt ? `<a class="yt" href="https://www.youtube.com/watch?v=${esc(x.yt)}" target="_blank" rel="noopener">${ICON.play}${t("trailer")}</a>` : ""}
      ${link ? `<a href="${link}" target="_blank" rel="noopener">IMDb</a>` : ""}
      <a href="https://www.themoviedb.org/${kind}/${m.id}" target="_blank" rel="noopener">TMDB</a>
    </div>`;
}
function renderSheet(x){
  const m = sheetM; if (!m) return;
  $("#sheetBody").innerHTML = detHead(m) + detBody(m, x) + seasonsBlock(m) + detLinks(m, x, sheetDice);
}
$(".sheet-x").addEventListener("click", hideSheet);
$("#sheetBody").addEventListener("click", e => {
  if (e.target.closest(".again")) { rollDice(); return; }
  const btn = e.target.closest("button.ib"); if (btn && sheetM) toggleMark(String(sheetM.id), btn);

/* a leírás nyelvének váltása (HU/DE/EN): megjegyezzük, és minden nyitott adatlap átvált */
document.addEventListener("click", e => {
  const b = e.target.closest(".ovsw button[data-ol]"); if (!b || b.disabled) return;
  e.stopPropagation();
  ovPref = b.dataset.ol; store("ovLang", ovPref);

    const el = $(`#list .exp[data-for="${listOpen}"]`), m = cur().byId[listOpen], k = kind;

});
/* ✓ láttam / megnézem / ajánlom gomb az adatlapon (🎲 vagy trend-panel):
   a listába ment, és mindenhol frissít, ahol a cím épp látszik */
function toggleMark(id, btn){
  const name = btn.classList.contains("star") ? "watch" : btn.classList.contains("rec") ? "recs" : "seen";
  const obj = L[kind][name];
  if (obj[id]) delete obj[id]; else obj[id] = today();
  saveList(kind, name);
  const m = cur().byId[id]; if (!m) return;
  const row = $(`#list .film[data-id="${id}"]`); if (row) row.outerHTML = card(m);
  if (sheetM && String(sheetM.id) === id) loadDetails(kind, id).then(x => { renderSheet(x); popBtn("#sheetBody", name); });
  if (trOpen && trOpen.id === id) refreshTr().then(() => popBtn("#trDet", name));
}

/* ===== 9c2. LENYÍLÓ ADATLAP A LISTÁBAN ====================================
   A sorra kattintva alatta lenyílik: történet, rendező, szereplők, linkek.
   Egyszerre csak egy lehet nyitva; újabb kattintásra becsukódik. */
function expHTML(m, x){ return `<div class="expin">${detBody(m, x)}${detLinks(m, x)}</div>`; }
function closeExp(animate = false){
  const id = listOpen, row = id && $(`#list .film[data-id="${id}"]`);
  listOpen = null;
  if (!row) return;
  row.classList.remove("open");
  const a = row.querySelector(".ttl"); if (a) a.setAttribute("aria-expanded", "false");
  const n = row.nextElementSibling;
  if (n && n.classList.contains("exp")) {
    if (animate && !reduced()) { n.classList.remove("open"); setTimeout(() => n.remove(), 280); }
    else n.remove();
  }
}
function toggleExp(row){
  const id = row.dataset.id, top = row.getBoundingClientRect().top, same = listOpen === id;
  closeExp(same);          // ugyanarra koppintva szépen csukódik; másikra váltva azonnal
  if (!same) {
    const m = cur().byId[id]; if (!m) return;
    listOpen = id; row.classList.add("open");
    const a = row.querySelector(".ttl"); if (a) a.setAttribute("aria-expanded", "true");
    row.insertAdjacentHTML("afterend", `<div class="fold exp" data-for="${id}"><div>${expHTML(m, {loading: true})}</div></div>`);
    const el = row.nextElementSibling; void el.offsetHeight; el.classList.add("open");
    const k = kind;
    loadDetails(k, id).then(x => { if (el.isConnected && kind === k) el.firstElementChild.innerHTML = expHTML(m, x); });
  }
  // ha fölötte egy másik adatlap csukódott be, a kattintott sor ne ugorjon el
  const d = row.getBoundingClientRect().top - top;
  if (d) window.scrollBy({top: d, behavior: "instant"});
}

/* ===== 9d. 🎲 VÉLETLEN AJÁNLÁS ===========================================
   A mostani szűrők eredményéből: elérhető, még nem látott, nem elrejtett.
   Ha van 70-es kombi fölötti, azok közül sorsol, különben bármelyikből. */
function rollDice(){
  const {seen, hidden} = L[kind];
  const pool = view.filter(m => m._on && !seen[m.id] && !hidden[m.id]);
  const good = pool.filter(m => (combo(m) ?? 0) >= 70);
  const from = good.length ? good : pool;
  if (!from.length) { alert(t("diceNone")); return; }
  let m = from[Math.floor(Math.random() * from.length)];
  if (from.length > 1 && sheetM && m === sheetM) m = from[(from.indexOf(m) + 1) % from.length];   // ne ugyanazt
  openSheet(m, true);
}
$("#dice").addEventListener("click", rollDice);

/* ===== 9e. IMPORT CSV-BŐL (IMDb / Letterboxd / Netflix) → "Láttam" =========
   IMDb:       "Const" oszlop (tt-azonosító) – filmek és sorozatok
   Letterboxd: "Name" + "Year" oszlop – filmek, cím és év alapján
   Netflix:    "Title" + "Date" oszlop – "Sorozat: Évad: Rész" → sorozat,
               különben film, cím alapján */
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function titleIndex(k){
  const idx = {};
  (D[k] ? D[k].all : []).forEach(m => [m.title, m.title_hu, m.orig].forEach(tl => { const n = norm(tl); if (n) (idx[n] = idx[n] || []).push(m); }));
  return idx;
}
$("#impCsv").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  await Promise.all(["movie", "tv"].map(k => loadKind(k).catch(() => null)));
  const rows = parseCSV((await f.text()).replace(/^﻿/, ""));
  if (rows.length < 2) { alert(t("impCsvBad")); return; }
  const head = rows[0].map(h => h.trim()), col = n => head.indexOf(n), data = rows.slice(1);
  const hit = {movie: new Set(), tv: new Set()}; let miss = 0;
  const mark = (k, m) => { if (m) hit[k].add(String(m.id)); return !!m; };
  if (col("Const") >= 0) {                               // IMDb
    const byImdb = {};
    ["movie", "tv"].forEach(k => (D[k] ? D[k].all : []).forEach(m => { if (m.imdb_id) byImdb[m.imdb_id] = [k, m]; }));
    data.forEach(r => { const x = byImdb[(r[col("Const")] || "").trim()]; if (!(x && mark(x[0], x[1]))) miss++; });
  } else if (col("Name") >= 0 && col("Year") >= 0) {      // Letterboxd
    const idx = titleIndex("movie");
    data.forEach(r => {
      const c = idx[norm(r[col("Name")])] || [], y = (r[col("Year")] || "").trim();
      if (!mark("movie", c.find(m => m.year === y) || (c.length === 1 ? c[0] : null))) miss++;
    });
  } else if (col("Title") >= 0) {                        // Netflix
    const tv = titleIndex("tv"), mv = titleIndex("movie");
    data.forEach(r => {
      const full = r[col("Title")] || "", first = full.split(": ")[0];
      if (full.includes(": ") && (tv[norm(first)] || []).length) mark("tv", tv[norm(first)][0]);
      else if ((mv[norm(full)] || []).length) mark("movie", mv[norm(full)][0]);
      else if ((tv[norm(full)] || []).length) mark("tv", tv[norm(full)][0]);
      else miss++;
    });
  } else { alert(t("impCsvBad")); return; }
  ["movie", "tv"].forEach(k => { hit[k].forEach(id => { if (!L[k].seen[id]) L[k].seen[id] = today(); }); saveList(k, "seen"); });
  apply();
  alert(t("impCsvOk")(hit.movie.size, hit.tv.size, miss));
});

/* ===== 10. ADATOK BETÖLTÉSE ==============================================
   Fajtánként csak az első megnyitáskor töltjük le a fájlt, utána a memóriából
   dolgozunk. A sorozatok fájlja az első v3-futásig még nem létezik. */
function loadKind(k){
  if (D[k]) return Promise.resolve(D[k]);
  return fetch(KINDS[k].file, {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(db => {
      const all = Object.values(db[KINDS[k].key] || db.movies || db.items || {});
      // régi (csak Netflix) adatforma átalakítása, ha még ilyen a fájl
      all.forEach(m => { for (const [c, a] of Object.entries(m.avail || {})) if ("on" in a || "first" in a) m.avail[c] = {netflix: a}; });
      return D[k] = {
        all, updated: db.updated || null, genres: db.genres || {}, since: db.since || {},
        services: db.services || {netflix: {name: "Netflix", logo: null}},
        initial: all.map(m => m.added || "").filter(Boolean).sort()[0] || "",
        years: [...new Set(all.map(m => m.year).filter(Boolean))].sort(),
        byId: Object.fromEntries(all.map(m => [String(m.id), m])),   // gyors keresés azonosító szerint
        trending: db.trending || [],                                  // heti trendlista (sorrend)
        det: {},                                                      // betöltött adatlap-fájlok
      };
    });
}
function showKind(){
  applyTexts();
  loadKind(kind).then(() => {
    applyTexts(); restoreFilters(); apply();
  }).catch(() => {
    applyTexts(); restoreFilters();
    $("#stats").textContent = "";
    $("#list").innerHTML = `<p class="error">${t("error")}</p>`;
  });
}
// ajánlások a repóból (nem kötelező, a fájl hiányozhat)
fetch("data/ajanlasok.json", {cache: "no-cache"})
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d) { recsRemote = {movie: d.recs || {}, tv: d.recs_tv || {}}; apply(); } })
  .catch(() => {});
$("#stats").textContent = t("loading");
showKind();
// a másik fül adatait a háttérben előre betöltjük, így a váltás azonnali
setTimeout(() => loadKind(kind === "movie" ? "tv" : "movie").then(fillSvcBar).catch(() => {}), 1500);
</script>
</body>
</html>
